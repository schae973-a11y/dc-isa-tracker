<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Asset Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        
        html, body { background-color: #f8fafc; margin: 0; font-family: 'Inter', -apple-system, sans-serif; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .flip5-container { max-width: 360px; margin: 0 auto; min-height: 100vh; }
        
        /* 다크 테마 대시보드 커스텀 */
        .dashboard-gradient {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        .sort-btn.active { background-color: #0f172a !important; color: #ffffff !important; }
        .sort-btn.asc::after  { content: ' ↑'; font-size: 10px; }
        .sort-btn.desc::after { content: ' ↓'; font-size: 10px; }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinning { animation: spin 0.8s linear infinite; }
    </style>
</head>
<body class="antialiased">

    <div class="flip5-container bg-slate-50 flex flex-col shadow-inner">

        <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-xl border-b border-slate-200 px-4 pt-3 pb-2.5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <div class="h-2.5 w-2.5 rounded-full bg-indigo-600 animate-pulse"></div>
                    <h1 class="text-[15px] font-black text-slate-900 tracking-tight">PORTFOLIO CORE</h1>
                </div>
                <div class="flex items-center gap-2">
                    <div id="last-update" class="text-[11px] font-bold text-slate-400 tabular-nums">CONNECTING</div>
                    <button onclick="manualRefresh()" id="refresh-btn"
                        class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 active:scale-90 transition-all">
                        <i id="refresh-icon" class="fa-solid fa-rotate-right text-[11px]"></i>
                    </button>
                </div>
            </div>

            <div class="flex p-0.5 bg-slate-200/50 rounded-xl border border-slate-200">
                <button onclick="switchTab('dc')" id="tab-dc" class="flex-1 py-2 text-[11px] font-black rounded-lg transition-all">PENSION DC</button>
                <button onclick="switchTab('isa')" id="tab-isa" class="flex-1 py-2 text-[11px] font-black rounded-lg transition-all">ISA CORE</button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto px-4 py-4 space-y-5">

            <section class="dashboard-gradient rounded-[28px] p-5 text-white relative overflow-hidden">
                <div class="absolute top-0 right-0 p-4 opacity-10">
                    <i class="fa-solid fa-shield-halved text-5xl"></i>
                </div>
                
                <div class="text-[11px] font-black text-slate-400 tracking-[0.1em] mb-2 text-center" id="account-title">TOTAL EVALUATION</div>
                <div id="total-eval" class="text-[34px] font-black tracking-tighter tabular-nums mb-6 text-center leading-none">₩ 0</div>

                <div class="grid grid-cols-3 gap-2 pt-5 border-t border-white/10">
                    <div class="text-center">
                        <div class="text-[9px] font-bold text-slate-500 mb-1 leading-tight">선형 성과 가치</div>
                        <div id="day-change-rate" class="text-[12px] font-black tabular-nums">0.00%</div>
                        <div id="day-change-amt" class="text-[10px] font-bold tabular-nums opacity-60">─ 0원</div>
                    </div>
                    <div class="text-center border-x border-white/5">
                        <div class="text-[9px] font-bold text-slate-500 mb-1 leading-tight">체감 가치</div>
                        <div id="total-profit-amt" class="text-[12px] font-black tabular-nums">₩ 0</div>
                    </div>
                    <div class="text-center">
                        <div class="text-[9px] font-bold text-slate-500 mb-1 leading-tight">모든 가치</div>
                        <div id="total-profit-rate" class="text-[12px] font-black tabular-nums text-emerald-400">0.00%</div>
                    </div>
                </div>
            </section>

            <section class="flex items-center justify-between bg-transparent px-1">
                <span class="text-[13px] font-black text-slate-800">
                    ASSETS <span id="item-count" class="text-indigo-600">0</span>
                </span>
                <div class="flex gap-1.5">
                    <button onclick="setSort('default')" id="sort-default" class="sort-btn px-3 py-1.5 text-[10px] font-black text-slate-500 bg-white border border-slate-200 rounded-full shadow-sm">DEFAULT</button>
                    <button onclick="setSort('currentRate')" id="sort-currentRate" class="sort-btn px-3 py-1.5 text-[10px] font-black text-slate-500 bg-white border border-slate-200 rounded-full shadow-sm">DAILY</button>
                </div>
            </section>

            <div id="items-container" class="space-y-3 pb-8">
                <div class="bg-white rounded-3xl h-24 animate-pulse border border-slate-200"></div>
            </div>
        </main>
    </div>

    <script>
        const dcGasUrl  = "https://script.google.com/macros/s/AKfycby8XB0dOwk5Tw7yUmQMiv0RfGOeYOjD_1uUcTA-rUYdc4YDoNME46GEK4ZhaxZ0b8hO/exec";
        const isaGasUrl = "https://script.google.com/macros/s/AKfycbxW7zkcTspkQKcUFJrzydqh1gbLaUmQFUraHXeSXke3TC-y4xmjXoZ2F0g8Bq743QTA/exec";

        let currentTab  = 'dc';
        let currentSort = 'default';   
        let sortDir     = {};           
        let cachedData  = null;

        function fmtWon(val) {
            return '₩' + Math.round(val).toLocaleString();
        }
        function fmtRate(val) {
            const n = parseFloat(val);
            if (isNaN(n)) return '0.00%';
            return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
        }
        function rateColor(val) {
            const n = parseFloat(val);
            if (n > 0) return 'text-rose-400';
            if (n < 0) return 'text-blue-400';
            return 'text-slate-400';
        }

        function switchTab(tab) {
            currentTab  = tab;
            currentSort = 'default';
            document.getElementById('tab-dc').className  = `flex-1 py-2 text-center text-[10px] font-black rounded-lg transition-all ${tab==='dc'  ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`;
            document.getElementById('tab-isa').className = `flex-1 py-2 text-center text-[10px] font-black rounded-lg transition-all ${tab==='isa' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`;
            fetchData();
        }

        function setSort(prop) {
            if (prop === 'default') {
                currentSort = 'default';
            } else {
                if (currentSort === prop) {
                    sortDir[prop] = (sortDir[prop] || 1) * -1;   
                } else {
                    currentSort   = prop;
                    sortDir[prop] = sortDir[prop] || 1;           
                }
            }
            updateSortButtons();
            if (cachedData) renderItems(cachedData.items);
        }

        function updateSortButtons() {
            ['default','currentRate'].forEach(id => {
                const btn = document.getElementById('sort-' + id);
                if (!btn) return;
                btn.classList.toggle('active', currentSort === id);
                btn.classList.remove('asc','desc');
                if (currentSort === id && id !== 'default') {
                    btn.classList.add(sortDir[id] === 1 ? 'desc' : 'asc');
                }
            });
        }

        function manualRefresh() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('spinning');
            fetchData(() => {
                setTimeout(() => icon.classList.remove('spinning'), 500);
            });
        }

        function fetchData(onDone) {
            const container = document.getElementById('items-container');
            const targetUrl = currentTab === 'dc' ? dcGasUrl : isaGasUrl;
            const old = document.getElementById('gas-script');
            if (old) old.remove();

            window.handleGasResponse = function(response) {
                cachedData = response;
                renderData(response);
                if (onDone) onDone();
            };

            const script = document.createElement('script');
            script.id = 'gas-script';
            script.src = `${targetUrl}?callback=handleGasResponse&_=${Date.now()}`;
            document.body.appendChild(script);
        }

        function renderData(data) {
            document.getElementById('account-title').innerText = currentTab === 'dc' ? 'PENSION DC EVALUATION' : 'ISA CORE EVALUATION';
            document.getElementById('total-eval').innerText = fmtWon(data.summary.totalEval);

            const diffAmt = data.summary.diffAmt || 0;
            const diffRate = data.summary.diffRate || 0;
            const amtEl = document.getElementById('day-change-amt');
            const rateEl = document.getElementById('day-change-rate');

            rateEl.innerText = fmtRate(diffRate);
            rateEl.className = `text-[13px] font-black tabular-nums ${rateColor(diffAmt)}`;
            amtEl.innerText = (diffAmt >= 0 ? '▲ ' : '▼ ') + Math.round(Math.abs(diffAmt)).toLocaleString() + '원';

            const profitAmt = data.summary.totalProfitAmt || 0;
            const profitRate = data.summary.totalProfitRate || 0;
            document.getElementById('total-profit-amt').innerText = fmtWon(profitAmt);
            document.getElementById('total-profit-amt').className = `text-[13px] font-black tabular-nums ${rateColor(profitAmt)}`;
            document.getElementById('total-profit-rate').innerText = fmtRate(profitRate);
            document.getElementById('total-profit-rate').className = `text-[13px] font-black tabular-nums ${rateColor(profitRate)}`;

            const now = new Date();
            document.getElementById('last-update').innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            renderItems(data.items);
        }

        function renderItems(rawItems) {
            let items = [...rawItems];
            if (currentSort === 'default') {
                items.sort((a, b) => ((a.rebalanceStatus && a.rebalanceStatus !== '정상') ? 0 : 1) - ((b.rebalanceStatus && b.rebalanceStatus !== '정상') ? 0 : 1));
            } else {
                const dir = sortDir[currentSort] || 1;
                items.sort((a, b) => dir * (b[currentSort] - a[currentSort]));
            }

            document.getElementById('item-count').innerText = items.length;
            const container = document.getElementById('items-container');
            container.innerHTML = '';

            items.forEach(item => {
                const isWarning = item.rebalanceStatus && item.rebalanceStatus !== '정상' && item.rebalanceStatus !== '';
                const tw = item.targetWeight ? (Math.abs(item.targetWeight) < 1 ? item.targetWeight * 100 : item.targetWeight).toFixed(1) : '0.0';
                const cw = item.currentWeight ? (Math.abs(item.currentWeight) < 1 ? item.currentWeight * 100 : item.currentWeight).toFixed(1) : '0.0';

                const card = document.createElement('div');
                card.className = `bg-white rounded-[24px] border border-slate-200 overflow-hidden relative shadow-sm ${isWarning ? 'ring-2 ring-rose-500/20' : ''}`;

                card.innerHTML = `
                    <div class="px-4 py-4">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[9px] font-black px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 uppercase border border-slate-200">${item.category}</span>
                            ${isWarning ? '<span class="text-[9px] font-black text-rose-600 bg-rose-5
