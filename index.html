<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자산 모니터링 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html { background-color: #f1f5f9 !important; }
        body { background-color: #f1f5f9 !important; margin: 0; font-family: -apple-system, sans-serif; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .flip5-container { max-width: 360px; margin: 0 auto; min-height: 100vh; }
        .sort-btn.active { background-color: #334155 !important; color: #ffffff !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-slate-200">

    <div class="flip5-container bg-slate-50 flex flex-col shadow-2xl border-x border-slate-200/50">
        
        <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 pt-3 pb-2.5 shrink-0">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <div class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <h1 class="text-[15px] font-black text-slate-900 tracking-tight">자산 관리 시스템</h1>
                </div>
                <div id="last-update" class="text-[10px] font-semibold text-slate-400 tabular-nums">연결 중...</div>
            </div>
            
            <div class="flex p-0.5 bg-slate-100 rounded-lg border border-slate-200/50">
                <button onclick="switchTab('dc')" id="tab-dc" class="flex-1 py-1.5 text-center text-xs font-bold rounded-md transition-all duration-200 text-slate-500">
                    <i class="fa-solid : fa-wallet mr-1.5 opacity-70"></i>DC 연금
                </button>
                <button onclick="switchTab('isa')" id="tab-isa" class="flex-1 py-1.5 text-center text-xs font-bold rounded-md transition-all duration-200 text-slate-500">
                    <i class="fa-solid : fa-chart-line mr-1.5 opacity-70"></i>ISA 중개
                </button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto px-4 py-3 space-y-4">
            
            <section class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-950 rounded-2xl p-4 text-white shadow-xl shadow-slate-950/20 relative overflow-hidden">
                <div class="absolute -right-6 -bottom-6 text-white/[0.03] text-7xl font-black select-none pointer-events-none">PORTFOLIO</div>
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1" id="account-title">TOTAL EVALUATION</div>
                <div id="total-eval" class="text-2xl font-black tracking-tight tabular-nums mb-3 text-slate-100">₩ 0</div>
                
                <div class="grid grid-cols-2 gap-2 pt-3 border-t border-white/10">
                    <div>
                        <div class="text-[9px] font-bold text-slate-400 tracking-wider mb-0.5">당일 변동폭</div>
                        <div id="day-change" class="text-[12px] font-bold tabular-nums flex flex-wrap items-center gap-1">0 (0.00%)</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[9px] font-bold text-slate-400 tracking-wider mb-0.5">누적 손익</div>
                        <div id="total-profit" class="text-[12px] font-bold text-emerald-400 tabular-nums">₩ 0</div>
                    </div>
                </div>
            </section>

            <section class="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200/60 shadow-sm">
                <span class="text-[11px] font-bold text-slate-400"><i class="fa-solid : fa-arrow-down-wide-short mr-1"></i>보유 종목</span>
                <div class="flex gap-1">
                    <button onclick="setSort('evalAmt')" id="sort-evalAmt" class="sort-btn px-2.5 py-1 text-[10px] font-bold text-slate-500 bg-slate-50 rounded-md transition-all border border-slate-200/30">평가액순</button>
                    <button onclick="setSort('currentRate')" id="sort-currentRate" class="sort-btn px-2.5 py-1 text-[10px] font-bold text-slate-500 bg-slate-50 rounded-md transition-all border border-slate-200/30">수익률순</button>
                </div>
            </section>

            <div id="items-container" class="space-y-2.5 pb-6">
                <div class="bg-white rounded-xl h-20 animate-pulse border border-slate-200/50"></div>
                <div class="bg-white rounded-xl h-20 animate-pulse border border-slate-200/50"></div>
            </div>
        </main>
    </div>

    <script>
        const dcGasUrl = "https://script.google.com/macros/s/AKfycbzQ434O1pMQCK5v2nLtABsKvtDIDRrDQ6clmuDH9pcf4wV80AEY/exec"; // 본인 DC 웹앱 URL 기입
        const isaGasUrl = "https://script.google.com/macros/s/AKfycbz1FZC6-wdpKzzZZANTwj1qXDLD1sHTrlh0XngmQc_95_0/exec"; // 본인 ISA 웹앱 URL 기입
        
        let currentTab = 'dc';
        let currentSort = 'evalAmt';
        let cachedData = null;

        // UI 개선: 부호 포맷팅 통합 적용 함수 (+/- 강제)
        function formatRate(value) {
            const num = parseFloat(value);
            if (isNaN(num)) return '0.00%';
            if (num > 0) return `+${num.toFixed(2)}%`;
            if (num < 0) return `${num.toFixed(2)}%`;
            return '0.00%';
        }

        function formatCurrency(val) {
            return '₩ ' + Math.round(val).toLocaleString();
        }

        function getRateColor(val) {
            const num = parseFloat(val);
            if (num > 0) return 'text-rose-500';
            if (num < 0) return 'text-blue-600';
            return 'text-slate-600';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-dc').className = `flex-1 py-1.5 text-center text-xs font-bold rounded-md transition-all duration-200 ${tab === 'dc' ? 'bg-white text-slate-900 shadow-sm border border-slate-200/50' : 'text-slate-500 hover:bg-white/50'}`;
            document.getElementById('tab-isa').className = `flex-1 py-1.5 text-center text-xs font-bold rounded-md transition-all duration-200 ${tab === 'isa' ? 'bg-white text-slate-900 shadow-sm border border-slate-200/50' : 'text-slate-500 hover:bg-white/50'}`;
            fetchData();
        }

        function setSort(prop) {
            currentSort = prop;
            document.getElementById('sort-evalAmt').classList.toggle('active', prop === 'evalAmt');
            document.getElementById('sort-currentRate').classList.toggle('active', prop === 'currentRate');
            if (cachedData) renderData(cachedData);
        }

        function fetchData() {
            const container = document.getElementById('items-container');
            container.innerHTML = `<div class="bg-white rounded-xl h-20 flex items-center justify-center border border-slate-200/50 text-xs font-semibold text-slate-400"><i class="fa-solid : fa-circle-notch animate-spin mr-2"></i>최신 자산 데이터 동기화 중...</div>`;
            
            const targetUrl = currentTab === 'dc' ? dcGasUrl : isaGasUrl;
            
            // 기존 스크립트 삭제 캐시 방지 처리
            const oldScript = document.getElementById('gas-script');
            if (oldScript) oldScript.remove();
            
            window.handleGasResponse = function(response) {
                cachedData = response;
                renderData(response);
            };

            const script = document.createElement('script');
            script.id = 'gas-script';
            script.src = `${targetUrl}?callback=handleGasResponse&_=${new Date().getTime()}`;
            document.body.appendChild(script);
        }

        function renderData(data) {
            document.getElementById('account-title').innerText = currentTab === 'dc' ? 'DC RETIREMENT PENSION' : 'ISA INVESTMENT ACCOUNT';
            document.getElementById('total-eval').innerText = formatCurrency(data.summary.totalEval);
            
            // UI 개선: 상단 요약 변동 영역에 명확한 기호 배정 및 부호 포맷팅 적용
            const yesterday = data.summary.totalEval_yesterday || data.summary.totalEval;
            const diffAmt = data.summary.totalEval - yesterday;
            const diffRate = yesterday > 0 ? (diffAmt / yesterday) * 100 : 0;
            
            let changeEl = document.getElementById('day-change');
            if (diffAmt > 0) {
                changeEl.className = "text-[13px] font-bold text-rose-400 tabular-nums flex items-center gap-1";
                changeEl.innerHTML = `▲ ${Math.abs(diffAmt).toLocaleString()}원 <span class="bg-rose-500/20 px-1.5 py-0.5 rounded text-[11px] font-black">+${diffRate.toFixed(2)}%</span>`;
            } else if (diffAmt < 0) {
                changeEl.className = "text-[13px] font-bold text-blue-400 tabular-nums flex items-center gap-1";
                changeEl.innerHTML = `▼ ${Math.abs(diffAmt).toLocaleString()}원 <span class="bg-blue-500/20 px-1.5 py-0.5 rounded text-[11px] font-black">${diffRate.toFixed(2)}%</span>`;
            } else {
                changeEl.className = "text-[13px] font-bold text-slate-400 tabular-nums flex items-center gap-1";
                changeEl.innerHTML = `─ 0원 <span class="bg-slate-500/20 px-1.5 py-0.5 rounded text-[11px] font-black">0.00%</span>`;
            }

            document.getElementById('total-profit').innerText = formatCurrency(data.summary.totalProfitAmt);
            document.getElementById('total-profit').className = `text-[13px] font-bold tabular-nums ${getRateColor(data.summary.totalProfitAmt)}`;
            
            const now = new Date();
            document.getElementById('last-update').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            let items = [...data.items];
            items.sort((a, b) => b[currentSort] - a[currentSort]);

            const container = document.getElementById('items-container');
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200/60 shadow-sm overflow-hidden flex flex-col relative transition-all duration-200 active:scale-[0.99]";
                
                const isWarning = item.rebalanceStatus !== "정상" && item.rebalanceStatus !== "";
                const targetWeight = item.targetWeight ? `${(item.targetWeight * 100).toFixed(1)}%` : '미지정';
                const currentWeight = item.currentWeight ? `${(item.currentWeight * 100).toFixed(1)}%` : '0.0%';

                // UI 개선: 상단 조정 레이아웃 고정 및 우하단에 목표 비중 가이드 바 노출
                if (isWarning) {
                    card.classList.add('border-rose-200', 'bg-rose-50/[0.15]');
                    card.innerHTML = `
                        <div class="bg-rose-500 text-white text-[9px] font-black px-3 py-1 flex items-center justify-between tracking-wide shadow-inner">
                            <span><i class="fa-solid : fa-triangle-exclamation mr-1"></i>비중 조정 필요</span>
                            <span class="text-[8px] bg-white/20 px-1 rounded">목표: ${targetWeight} / 현재: ${currentWeight}</span>
                        </div>`;
                }

                const mainContent = document.createElement('div');
                mainContent.className = "px-4 py-2.5 flex items-center justify-between gap-3";
                
                mainContent.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5 mb-0.5">
                            <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 border border-slate-200/50 shrink-0 uppercase tracking-tight">${item.category}</span>
                            <span class="font-bold text-slate-900 text-[13px] truncate">${item.name}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 font-semibold tabular-nums">
                            ${formatCurrency(item.evalAmt)}
                            ${!isWarning ? `<span class="text-[10px] text-slate-300 ml-1.5 font-normal">(목표 ${targetWeight})</span>` : ''}
                        </div>
                    </div>
                    <div class="text-right tabular-nums shrink-0">
                        <div class="${getRateColor(item.currentRate)} font-bold text-[13px] tracking-tight">${formatRate(item.currentRate)}</div>
                        <div class="${getRateColor(item.cumulativeRate)} text-[10px] font-bold opacity-75 mt-0.5">${formatRate(item.cumulativeRate)}</div>
                    </div>
                `;
                
                card.appendChild(mainContent);
                container.appendChild(card);
            });
        }

        window.onload = function() {
            switchTab('dc');
            setInterval(fetchData, 60000); // 1분 단위 백그라운드 자동 갱신
        };
    </script>
</body>
</html>
