<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자산 모니터링 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        html, body { background-color: #f1f5f9; margin: 0; font-family: -apple-system, sans-serif; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
        .flip5-container { max-width: 360px; margin: 0 auto; min-height: 100vh; }
        .sort-btn.active { background-color: #334155 !important; color: #ffffff !important; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

    <div class="flip5-container bg-slate-50 flex flex-col shadow-2xl border-x border-slate-200/50">
        
        <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 pt-3 pb-2.5">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                    <div class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></div>
                    <h1 class="text-[15px] font-black text-slate-900">자산 관리 시스템</h1>
                </div>
                <div id="last-update" class="text-[10px] font-semibold text-slate-400 tabular-nums">연결 중...</div>
            </div>
            
            <div class="flex p-0.5 bg-slate-100 rounded-lg border border-slate-200/50">
                <button onclick="switchTab('dc')" id="tab-dc" class="flex-1 py-1.5 text-center text-xs font-bold rounded-md transition-all">DC 연금</button>
                <button onclick="switchTab('isa')" id="tab-isa" class="flex-1 py-1.5 text-center text-xs font-bold rounded-md transition-all">ISA 중개</button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto px-4 py-3 space-y-4">
            
            <section class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-950 rounded-2xl p-4 text-white shadow-xl relative overflow-hidden">
                <div class="text-[10px] font-bold text-slate-400 mb-1" id="account-title">EVALUATION</div>
                <div id="total-eval" class="text-2xl font-black tracking-tight tabular-nums mb-3 text-slate-100">₩ 0</div>
                
                <div class="grid grid-cols-2 gap-2 pt-3 border-t border-white/10">
                    <div>
                        <div class="text-[9px] font-bold text-slate-400 mb-0.5">당일 변동폭</div>
                        <div id="day-change" class="text-[12px] font-bold tabular-nums flex items-center gap-1">0원 (0.00%)</div>
                    </div>
                    <div class="text-right">
                        <div class="text-[9px] font-bold text-slate-400 mb-0.5">누적 손익</div>
                        <div id="total-profit" class="text-[12px] font-bold text-emerald-400 tabular-nums">₩ 0</div>
                    </div>
                </div>
            </section>

            <section class="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-slate-200/60 shadow-sm">
                <span class="text-[11px] font-bold text-slate-400">보유 종목</span>
                <div class="flex gap-1">
                    <button onclick="setSort('evalAmt')" id="sort-evalAmt" class="sort-btn px-2.5 py-1 text-[10px] font-bold text-slate-500 bg-slate-50 rounded-md">평가액순</button>
                    <button onclick="setSort('currentRate')" id="sort-currentRate" class="sort-btn px-2.5 py-1 text-[10px] font-bold text-slate-500 bg-slate-50 rounded-md">수익률순</button>
                </div>
            </section>

            <div id="items-container" class="space-y-2.5 pb-6">
                <div class="bg-white rounded-xl h-20 animate-pulse"></div>
            </div>
        </main>
    </div>

    <script>
        // ⚠️ 본인의 실제 배포된 구글 웹앱 URL 주소로 매핑해주세요!
        const dcGasUrl = "https://script.google.com/macros/s/AKfycby8XB0dOwk5Tw7yUmQMiv0RfGOeYOjD_1uUcTA-rUYdc4YDoNME46GEK4ZhaxZ0b8hO/exec"; 
        const isaGasUrl = "https://script.google.com/macros/s/AKfycbxW7zkcTspkQKcUFJrzydqh1gbLaUmQFUraHXeSXke3TC-y4xmjXoZ2F0g8Bq743QTA/exec";
        
        
        let currentTab = 'dc';
        let currentSort = 'evalAmt';
        let cachedData = null;

        function formatRate(value) {
            const num = parseFloat(value);
            if (isNaN(num)) return '0.00%';
            return num > 0 ? `+${num.toFixed(2)}%` : `${num.toFixed(2)}%`;
        }

        function formatCurrency(val) {
            return '₩ ' + Math.round(val).toLocaleString();
        }

        function getRateColor(val) {
            const num = parseFloat(val);
            if (num > 0) return 'text-rose-500';
            if (num < 0) return 'text-blue-600';
            return 'text-slate-600';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-dc').className = `flex-1 py-1.5 text-center text-xs font-bold rounded-md transition-all ${tab === 'dc' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`;
            document.getElementById('tab-isa').className = `flex-1 py-1.5 text-center text-xs font-bold rounded-md transition-all ${tab === 'isa' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`;
            fetchData();
        }

        function setSort(prop) {
            currentSort = prop;
            document.getElementById('sort-evalAmt').classList.toggle('active', prop === 'evalAmt');
            document.getElementById('sort-currentRate').classList.toggle('active', prop === 'currentRate');
            if (cachedData) renderData(cachedData);
        }

        function fetchData() {
            const container = document.getElementById('items-container');
            container.innerHTML = `<div class="text-center text-xs text-slate-400 py-6">동기화 중...</div>`;
            
            const targetUrl = currentTab === 'dc' ? dcGasUrl : isaGasUrl;
            const oldScript = document.getElementById('gas-script');
            if (oldScript) oldScript.remove();
            
            window.handleGasResponse = function(response) {
                if (!response || !response.summary) {
                    container.innerHTML = `<div class="text-center text-xs text-rose-500 py-6">데이터 규격 에러 발생</div>`;
                    return;
                }
                cachedData = response;
                renderData(response);
            };

            const script = document.createElement('script');
            script.id = 'gas-script';
            script.src = `${targetUrl}?callback=handleGasResponse&_=${new Date().getTime()}`;
            document.body.appendChild(script);
        }

        function renderData(data) {
            document.getElementById('account-title').innerText = currentTab === 'dc' ? 'DC RETIREMENT PENSION' : 'ISA INVESTMENT ACCOUNT';
            document.getElementById('total-eval').innerText = formatCurrency(data.summary.totalEval);
            
            const diffAmt = data.summary.diffAmt || 0;
            const diffRate = data.summary.diffRate || 0;
            let changeEl = document.getElementById('day-change');
            
            if (diffAmt > 0) {
                changeEl.className = "text-[12px] font-bold text-rose-500 tabular-nums flex items-center gap-1";
                changeEl.innerHTML = `▲ ${Math.abs(diffAmt).toLocaleString()}원 <span class="bg-rose-100 text-rose-600 px-1 rounded text-[10px] font-black">+${diffRate.toFixed(2)}%</span>`;
            } else if (diffAmt < 0) {
                changeEl.className = "text-[12px] font-bold text-blue-600 tabular-nums flex items-center gap-1";
                changeEl.innerHTML = `▼ ${Math.abs(diffAmt).toLocaleString()}원 <span class="bg-blue-100 text-blue-600 px-1 rounded text-[10px] font-black">${diffRate.toFixed(2)}%</span>`;
            } else {
                changeEl.className = "text-[12px] font-bold text-slate-400 tabular-nums flex items-center gap-1";
                changeEl.innerHTML = `─ 0원 <span class="bg-slate-100 text-slate-500 px-1 rounded text-[10px] font-black">0.00%</span>`;
            }

            document.getElementById('total-profit').innerText = formatCurrency(data.summary.totalProfitAmt);
            document.getElementById('total-profit').className = `text-[12px] font-bold tabular-nums ${getRateColor(data.summary.totalProfitAmt)}`;
            
            const now = new Date();
            document.getElementById('last-update').innerText = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            let items = [...data.items];
            items.sort((a, b) => b[currentSort] - a[currentSort]);

            const container = document.getElementById('items-container');
            container.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200/60 shadow-sm overflow-hidden flex flex-col relative";
                
                const isWarning = item.rebalanceStatus !== "정상" && item.rebalanceStatus !== "";
                const targetWeight = item.targetWeight ? `${(item.targetWeight * 100).toFixed(1)}%` : '미지정';
                const currentWeight = item.currentWeight ? `${(item.currentWeight * 100).toFixed(1)}%` : '0.0%';

                if (isWarning) {
                    card.classList.add('border-rose-200', 'bg-rose-50/[0.15]');
                    card.innerHTML = `
                        <div class="bg-rose-500 text-white text-[9px] font-black px-3 py-0.5 flex items-center justify-between tracking-wide">
                            <span><i class="fa-solid : fa-triangle-exclamation mr-1"></i>비중 조정 필요</span>
                            <span class="text-[8px] bg-white/20 px-1 rounded">목표: ${targetWeight} / 현재: ${currentWeight}</span>
                        </div>`;
                }

                const mainContent = document.createElement('div');
                mainContent.className = "px-4 py-2.5 flex items-center justify-between gap-3";
                mainContent.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5 mb-0.5">
                            <span class="text-[9px] font-black px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 uppercase">${item.category}</span>
                            <span class="font-bold text-slate-900 text-[13px] truncate">${item.name}</span>
                        </div>
                        <div class="text-[11px] text-slate-400 font-semibold tabular-nums">
                            ${formatCurrency(item.evalAmt)}
                            ${!isWarning ? `<span class="text-[10px] text-slate-300 ml-1.5 font-normal">(목표 ${targetWeight})</span>` : ''}
                        </div>
                    </div>
                    <div class="text-right tabular-nums shrink-0">
                        <div class="${getRateColor(item.currentRate)} font-bold text-[13px] tracking-tight">${formatRate(item.currentRate)}</div>
                        <div class="${getRateColor(item.cumulativeRate)} text-[10px] font-bold opacity-75 mt-0.5">${formatRate(item.cumulativeRate)}</div>
                    </div>
                `;
                
                card.appendChild(mainContent);
                container.appendChild(card);
            });
        }

        window.onload = function() {
            switchTab('dc');
            setInterval(fetchData, 60000);
        };
    </script>
</body>
</html>
