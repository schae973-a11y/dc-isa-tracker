<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자산 모니터링 시스템</title>
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .ticker-card { transition: transform 0.2s; }
        .ticker-card:active { transform: scale(0.98); }
        .nav-tab.active { border-bottom-color: #2E7D32; color: #2E7D32; font-weight: bold; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-20 select-none">
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-sm relative flex flex-col">
        <header class="sticky top-0 bg-white/90 backdrop-blur-md z-40 border-b border-slate-100 px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-chart-pie text-[#2E7D32]"></i>
                <span id="header-title">DC 연금계좌</span>
            </h1>
            <span id="base-date" class="text-xs text-slate-400 font-medium">조회중...</span>
        </header>

        <main class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
            <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-5 text-white shadow-md relative overflow-hidden">
                <div class="absolute right-0 bottom-0 opacity-5 translate-x-4 translate-y-4">
                    <i class="fa-solid fa-vault text-9xl"></i>
                </div>
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-xs text-slate-400 font-medium tracking-wider uppercase">Total Asset Value</p>
                        <h2 id="total-asset" class="text-2xl font-bold mt-1 tracking-tight">₩0</h2>
                    </div>
                    <span id="total-return-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-white/10">0.0%</span>
                </div>
                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-white/10 text-sm">
                    <div>
                        <p class="text-slate-400 text-xs">평가 손익</p>
                        <p id="total-gain" class="font-semibold mt-0.5">₩0</p>
                    </div>
                    <div>
                        <p class="text-slate-400 text-xs">총 매입금액</p>
                        <p id="total-purchase" class="font-semibold mt-0.5 text-slate-200">₩0</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 border border-slate-100 shadow-sm">
                <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-line text-slate-400"></i> 자산 비중 현황
                </h3>
                <div class="relative w-full aspect-square max-w-[240px] mx-auto">
                    <canvas id="assetChart"></canvas>
                </div>
                <div id="chart-legend" class="flex flex-wrap justify-center gap-x-4 gap-y-2 text-xs font-medium text-slate-500 mt-4 px-2"></div>
            </div>

            <div class="space-y-2">
                <h3 class="text-sm font-bold text-slate-700 px-1 flex justify-between items-center">
                    <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-list-ul text-slate-400"></i> 보유 종목 리스트
                    </span>
                    <span id="ticker-count" class="text-xs text-slate-400 font-normal">0개 종목</span>
                </h3>
                <div id="ticker-container" class="space-y-2">
                    </div>
            </div>
        </main>

        <nav class="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur-md border-t border-slate-100 flex justify-around items-center h-16 z-50 px-2">
            <button onclick="switchAccount('DC')" id="tab-dc" class="nav-tab flex-1 flex flex-col items-center justify-center h-full text-slate-400 border-t-2 border-transparent pt-1">
                <i class="fa-solid fa-wallet text-lg mb-1"></i>
                <span class="text-[10px] font-medium tracking-tight">DC 연금</span>
            </button>
            <button onclick="switchAccount('ISA')" id="tab-isa" class="nav-tab flex-1 flex flex-col items-center justify-center h-full text-slate-400 border-t-2 border-transparent pt-1">
                <i class="fa-solid fa-id-card text-lg mb-1"></i>
                <span class="text-[10px] font-medium tracking-tight">ISA 절세</span>
            </button>
            <button onclick="alert('토스증권 Open API 승인 대기 중입니다.')" id="tab-toss" class="nav-tab flex-1 flex flex-col items-center justify-center h-full text-slate-300 border-t-2 border-transparent pt-1">
                <i class="fa-solid fa-seedling text-lg mb-1"></i>
                <span class="text-[10px] font-medium tracking-tight">Toss 프로젝트</span>
            </button>
        </nav>
    </div>

    <script>
        let currentMode = 'DC';
        let chartInstance = null;
        let globalData = null;

        const colorMap = {
            'TIGER 미국S&P500': '#2E7D32',
            'ACE 미국빅테크TOP7': '#1565C0',
            'SOL 미국배당다우존스': '#AD1457',
            'KODEX 미국배당커버드콜': '#6A1B9A',
            '미국달러단기채권': '#455A64',
            '현금': '#9E9E9E',
            'KODEX 200': '#E65100',
            '한화 200': '#BF360C'
        };

        const defaultColors = ['#00838F', '#00796B', '#F57C00', '#D32F2F', '#C2185B', '#7B1FA2'];

        function getChartColor(name, index) {
            for (let key in colorMap) {
                if (name.includes(key)) return colorMap[key];
            }
            return defaultColors[index % defaultColors.length];
        }

        document.addEventListener('DOMContentLoaded', () => {
            switchAccount('DC');
        });

        function switchAccount(mode) {
            currentMode = mode;
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            
            if(mode === 'DC') document.getElementById('tab-dc').classList.add('active');
            else if(mode === 'ISA') document.getElementById('tab-isa').classList.add('active');
            
            document.getElementById('header-title').innerText = mode === 'DC' ? 'DC 연금계좌' : 'ISA 절세계좌';
            loadData();
        }

        function loadData() {
            document.getElementById('ticker-container').innerHTML = `
                <div class="flex flex-col items-center justify-center py-12 text-slate-400 gap-2">
                    <i class="fa-solid fa-circle-notch animate-spin text-2xl text-[#2E7D32]"></i>
                    <p class="text-xs font-medium">자산 데이터를 불러오는 중...</p>
                </div>`;
            
            google.script.run
                .withSuccessHandler(renderDashboard)
                .withFailureHandler(err => {
                    document.getElementById('ticker-container').innerHTML = `
                        <div class="text-center py-12 text-red-500 text-xs font-medium">
                            <i class="fa-solid fa-triangle-exclamation text-xl mb-1"></i>
                            <p>데이터 로드 실패: ${err.message}</p>
                        </div>`;
                })
                .getDashboardData(currentMode);
        }

        function formatWon(val) {
            return '₩' + Math.round(val).toLocaleString();
        }

        function renderDashboard(data) {
            globalData = data;
            
            document.getElementById('base-date').innerText = data.baseDate + ' 기준';
            document.getElementById('total-asset').innerText = formatWon(data.summary.totalAsset);
            document.getElementById('total-purchase').innerText = formatWon(data.summary.totalPurchase);
            
            const totalGainEl = document.getElementById('total-gain');
            totalGainEl.innerText = formatWon(data.summary.totalGain);
            if(data.summary.totalGain >= 0) {
                totalGainEl.className = "font-semibold mt-0.5 text-emerald-400";
            } else {
                totalGainEl.className = "font-semibold mt-0.5 text-rose-400";
            }

            const returnBadge = document.getElementById('total-return-badge');
            const totalRet = data.summary.totalReturn;
            returnBadge.innerText = (totalRet >= 0 ? '+' : '') + totalRet.toFixed(2) + '%';
            if(totalRet >= 0) {
                returnBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300";
            } else {
                returnBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-300";
            }

            document.getElementById('ticker-count').innerText = data.items.length + '개 종목';

            const sortedItems = [...data.items].sort((a, b) => (b.needsRebalancing ? 1 : 0) - (a.needsRebalancing ? 1 : 0));

            const container = document.getElementById('ticker-container');
            container.innerHTML = '';

            sortedItems.forEach(item => {
                const card = document.createElement('div');
                card.className = `ticker-card bg-white p-4 rounded-xl border ${item.needsRebalancing ? 'border-orange-200 bg-orange-50/20' : 'border-slate-100'} shadow-sm flex flex-col gap-2.5`;
                
                const returnText = (item.returnRate >= 0 ? '+' : '') + item.returnRate.toFixed(2) + '%';
                
                // 1) 수익률 굵기(bold) 제거: 단순 색상 클래스만 부여 (font-bold 제거)
                let returnColorClass = "text-slate-600";
                if(item.returnRate > 0) returnColorClass = "text-rose-500";
                else if(item.returnRate < 0) returnColorClass = "text-blue-500";

                // 2) 리밸런싱 안내 텍스트 변경: "리밸런싱 [목표 X% / 현재 Y%]"
                const rebalanceBadgeHtml = item.needsRebalancing 
                    ? `<span class="text-[11px] font-bold text-orange-600 bg-orange-100 px-2 py-0.5 rounded-md flex items-center gap-1">
                        <i class="fa-solid fa-triangle-exclamation"></i> 리밸런싱 [목표 ${item.targetPct}% / 현재 ${item.currentPct}%]
                       </span>` 
                    : '';

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="space-y-0.5">
                            <h4 class="font-bold text-sm text-slate-800 tracking-tight">${item.name}</h4>
                            <p class="text-xs text-slate-400 font-medium">${item.quantity.toLocaleString()}주 · 평가액 ${formatWon(item.evalAmount)}</p>
                        </div>
                        <div class="text-right">
                            <p class="${returnColorClass} text-sm font-medium tracking-tight">${returnText}</p>
                            <p class="text-[11px] font-bold text-slate-500 mt-0.5">비중 ${item.currentPct}%</p>
                        </div>
                    </div>
                    ${item.needsRebalancing ? `<div class="flex justify-start pt-1 border-t border-orange-100/50">${rebalanceBadgeHtml}</div>` : ''}
                `;
                container.appendChild(card);
            });

            renderChart(data.items);
        }

        function renderChart(items) {
            const ctx = document.getElementById('assetChart').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            const labels = items.map(i => i.name);
            const dataValues = items.map(i => i.currentPct);
            const backgroundColors = items.map((item, idx) => getChartColor(item.name, idx));

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: dataValues,
                        backgroundColor: backgroundColors,
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    cutout: '72%'
                }
            });

            const legendContainer = document.getElementById('chart-legend');
            legendContainer.innerHTML = '';
            items.forEach((item, idx) => {
                const color = backgroundColors[idx];
                const itemEl = document.createElement('div');
                itemEl.className = 'flex items-center gap-1.5';
                itemEl.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${color}"></span>
                    <span class="text-slate-600 tracking-tight">${item.name} <span class="font-bold text-slate-400 ml-0.5">${item.currentPct}%</span></span>
                `;
                legendContainer.appendChild(itemEl);
            });
        }
    </script>
</body>
</html>
