<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자산 모니터링 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-page:          #F0F4F2;
            --bg-card:          #FFFFFF;
            --bg-hero:          linear-gradient(135deg, #1B5E20 0%, #2E7D32 60%, #388E3C 100%);
            --bg-list:          #FFFFFF;

            /* 수익률 단일 색상 통일 (피드백 반영) */
            --c-up:             #D32F2F; /* 단일 깔끔한 빨강 */
            --c-down:           #1976D2; /* 단일 깔끔한 파랑 */
            --c-neutral:        #78909C; /* 보합 회색 */

            --primary:          #2E7D32;
            --primary-light:    #E8F5E9;
            --primary-dark:     #1B5E20;

            --c-text-primary:   #1A2519;
            --c-text-secondary: #546E57;
            --c-text-label:     #8FA892;
            --c-border:         #DDE8DF;
            --c-divider:        #EBF2EC;

            --skeleton-base:      #E2EDE4;
            --skeleton-highlight: #F0F7F1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-page);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: contain;
        }

        #main-dashboard {
            position: fixed; inset: 0;
            max-width: 390px; margin: 0 auto;
            display: flex; flex-direction: column;
            background: var(--bg-page);
            transition: transform 0.2s ease-out;
        }
        .header-fixed { flex-shrink: 0; }

        /* ── PTR ── */
        #ptr-indicator {
            position: absolute; top: -56px; left: 0; right: 0; height: 56px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--primary-light); color: var(--primary);
            font-size: 12px; font-weight: 600;
            border-bottom: 1px solid var(--c-border); z-index: 40;
        }

        /* ── 탭 바 ── */
        .tab-bar {
            padding: 14px 18px 0;
            display: flex; gap: 22px;
            background: var(--bg-page);
            border-bottom: 1px solid var(--c-border);
        }
        .nav-tab {
            font-size: 14px; font-weight: 600;
            color: var(--c-text-label);
            padding-bottom: 10px;
            position: relative; background: none; border: none; cursor: pointer;
            transition: color 0.2s;
        }
        .nav-tab.active { color: var(--primary); font-weight: 700; }
        .nav-tab.active::after {
            content: ""; position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 2.5px; background: var(--primary); border-radius: 2px;
        }

        /* ── 히어로 카드 (총 평가금액 공백 최적화) ── */
        .hero-card {
            margin: 10px 12px 0;
            background: var(--bg-hero);
            border-radius: 20px;
            padding: 18px 20px 16px;
            box-shadow: 0 8px 28px rgba(27,94,32,0.22), 0 2px 6px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }
        .hero-card::before {
            content: "";
            position: absolute; top: -30px; right: -20px;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
        }

        .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .hero-label {
            font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
            color: rgba(255,255,255,0.6); text-transform: uppercase;
            background: rgba(255,255,255,0.1);
            padding: 3px 8px; border-radius: 4px;
        }
        .refresh-btn {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.1);
            border: none; cursor: pointer; border-radius: 50%;
            transition: all 0.15s;
        }
        .refresh-btn:active { transform: scale(0.85); background: rgba(255,255,255,0.2); color: #fff; }

        .hero-eval-label { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 500; margin-bottom: 2px; }
        
        /* 금액 폰트를 시원하게 가로로 확장 및 자간 조정 (피드백 반영) */
        .hero-amount {
            font-size: 34px; font-weight: 800;
            color: #ffffff; letter-spacing: -0.03em;
            line-height: 1.1; font-variant-numeric: tabular-nums;
            margin-bottom: 4px;
            font-stretch: 105%;
        }
        .hero-diff {
            font-size: 13px; font-weight: 600;
            color: rgba(255,255,255,0.8);
            font-variant-numeric: tabular-nums;
            display: flex; align-items: center; gap: 4px;
        }
        .hero-diff.up   { color: #FFCDD2; }
        .hero-diff.down { color: #BBDEFB; }
        .hero-diff.neu  { color: rgba(255,255,255,0.5); }

        /* ── 수익 카드 2분할 ── */
        .perf-row {
            display: flex; gap: 8px;
            margin: 8px 12px 0;
        }
        .perf-card {
            flex: 1;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--c-border);
            padding: 12px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .perf-card-label {
            font-size: 11px; font-weight: 700;
            color: var(--c-text-label);
            letter-spacing: 0.02em; margin-bottom: 5px;
        }
        .perf-card-amt {
            font-size: 17px; font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1.2; margin-bottom: 2px;
        }
        .perf-card-rate {
            font-size: 12px; font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* ── Top 최고상승 카드 (배지 및 레이아웃 세련화) ── */
        .top-badge-today {
            font-size: 9px; font-weight: 700; color: #D32F2F;
            background: #FFEBEE; padding: 2px 6px; border-radius: 4px;
        }
        .top-badge-cum {
            font-size: 9px; font-weight: 700; color: #E65100;
            background: #FFF3E0; padding: 2px 6px; border-radius: 4px;
        }
        .top-card-name {
            font-size: 13px; font-weight: 700; color: var(--c-text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
        }

        .up-amt  { color: var(--c-up); }
        .up-rate { color: var(--c-up); }
        .dn-amt  { color: var(--c-down); }
        .dn-rate { color: var(--c-down); }
        .neu-amt, .neu-rate { color: var(--c-neutral); }

        /* ── 차트 카드 ── */
        .chart-card {
            margin: 8px 12px 0;
            background: var(--bg-card);
            border-radius: 14px;
            border: 1px solid var(--c-border);
            padding: 12px 14px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .chart-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 8px;
        }
        .chart-title {
            font-size: 11px; font-weight: 700;
            color: var(--c-text-secondary);
            letter-spacing: 0.04em;
            display: flex; align-items: center; gap: 4px;
        }
        .chart-legend-row {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
        }
        .legend-item {
            display: flex; align-items: center; gap: 3px;
            font-size: 9px; font-weight: 700; letter-spacing: 0.02em;
        }
        .legend-line {
            width: 12px; height: 2px; border-radius: 1px; flex-shrink: 0;
        }
        .chart-container { position: relative; width: 100%; height: 135px; }

        /* ── 종목 리스트 ── */
        .list-wrapper {
            flex: 1; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--bg-list);
            border-radius: 18px 18px 0 0;
            margin-top: 8px;
            border-top: 1px solid var(--c-border);
        }
        .list-wrapper::-webkit-scrollbar { display: none; }
        .list-wrapper { scrollbar-width: none; }

        .list-header {
            position: sticky; top: 0; z-index: 10;
            background: var(--bg-list);
            padding: 10px 16px 9px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--c-divider);
        }
        .list-title { font-size: 12px; font-weight: 700; color: var(--c-text-primary); }
        .list-count {
            font-size: 11px; font-weight: 700;
            color: var(--primary); background: var(--primary-light);
            padding: 1px 7px; border-radius: 10px; margin-left: 5px;
        }

        .sort-group {
            display: flex; background: var(--bg-page);
            padding: 2px; border-radius: 7px;
            border: 1px solid var(--c-border);
        }
        .sort-btn {
            font-size: 11px; font-weight: 600;
            color: var(--c-text-secondary);
            padding: 3px 10px; border-radius: 5px;
            border: none; background: none; cursor: pointer;
        }
        .sort-btn.active {
            background: var(--primary); color: #fff;
            box-shadow: 0 1px 4px rgba(46,125,50,0.25);
        }

        /* ── 종목 카드 ── */
        .ticker-list { padding: 0 0 32px; }
        .ticker-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 11px 16px;
            border-bottom: 1px solid var(--c-divider);
            background: transparent; position: relative;
            transition: background 0.1s;
        }
        .ticker-card:active { background: var(--bg-page); }
        .ticker-card.warn {
            border-left: 3px solid #F59E0B;
            padding-left: 13px;
            background: rgba(245,158,11,0.03);
        }

        /* 단일 색상 폰트 웨이트 정의 (피드백 반영) */
        .rate-up  { color: var(--c-up); font-weight: 700; }
        .rate-dn  { color: var(--c-down); font-weight: 700; }
        .rate-neu { color: var(--c-neutral); font-weight: 600; }

        /* ── PIN 화면 ── */
        #auth-screen {
            position: fixed; inset: 0; z-index: 50;
            background: var(--bg-page);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 24px;
        }
        .auth-box {
            background: #fff; padding: 32px 24px;
            border-radius: 24px; border: 1px solid var(--c-border);
            box-shadow: 0 10px 30px rgba(46,125,50,0.07);
            width: 100%; max-width: 300px; text-align: center;
        }
        .pin-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #DDE8DF; display: inline-block; transition: all 0.15s;
        }
        .pin-dot.active { background: var(--primary); transform: scale(1.2); }
        .key-btn {
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 600; border-radius: 50%;
            background: var(--bg-page); border: 1px solid var(--c-border);
            color: var(--c-text-primary); cursor: pointer;
        }
        .key-btn:active { background: var(--primary-light); color: var(--primary); transform: scale(0.95); }

        /* ── 스켈레톤 ── */
        @keyframes sk-pulse { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        .skeleton-loading-text {
            background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
            background-size: 200% 100%;
            animation: sk-pulse 1.4s infinite ease-in-out;
            border-radius: 4px; color: transparent !important; user-select: none;
        }
        .sk-hero-amt  { width: 180px; height: 36px; display: inline-block; }
        .sk-hero-diff { width: 120px; height: 16px; display: inline-block; margin-top: 6px; }
        .sk-p-amt     { width: 100px; height: 20px; display: inline-block; }
        .sk-p-rt      { width: 55px;  height: 13px; display: inline-block; margin-top: 3px; }
        .sk-card-left { display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .sk-tag  { width: 40px; height: 13px; }
        .sk-name { width: 130px; height: 15px; }
        .sk-eval { width: 75px;  height: 12px; }
        .sk-card-right { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
        .sk-cur  { width: 52px; height: 15px; }
        .sk-cum  { width: 44px; height: 12px; }
    </style>
</head>
<body>

<div id="ptr-indicator">
    <i id="ptr-icon" class="fa-solid fa-arrow-down" style="transition: transform 0.15s;"></i>
    <span id="ptr-text">당겨서 새로고침</span>
</div>

<div id="auth-screen">
    <div class="auth-box">
        <i class="fa-solid fa-shield-halved" style="font-size:28px; color:var(--primary); margin-bottom:16px; display:block;"></i>
        <h2 style="font-size:16px; font-weight:700; color:var(--c-text-primary); margin-bottom:20px;">보안 인증</h2>
        <div style="display:flex; justify-content:center; gap:12px; margin-bottom:26px;">
            <div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div><div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div><div class="pin-dot" id="dot-4"></div><div class="pin-dot" id="dot-5"></div>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px 10px; justify-items:center; max-width:216px; margin:0 auto 20px;">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <button class="key-btn" onclick="clearPin()" style="color:#ef4444; background:#fef2f2;"><i class="fa-solid fa-trash-can"></i></button>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn" onclick="backspacePin()" style="color:#5c7860;"><i class="fa-solid fa-backspace"></i></button>
        </div>
        <label style="font-size:12px; color:var(--c-text-secondary); cursor:pointer; display:inline-flex; align-items:center; gap:4px;">
            <input type="checkbox" id="keep-login" style="accent-color:var(--primary); width:14px; height:14px;"> 자동 로그인 유지
        </label>
    </div>
</div>

<div id="main-dashboard" style="display:none;">
    <div class="header-fixed">

        <div class="tab-bar">
            <button onclick="switchTab('dc')" id="tab-dc" class="nav-tab active">DC 연금</button>
            <button onclick="switchTab('isa')" id="tab-isa" class="nav-tab">ISA 계좌</button>
        </div>

        <div class="hero-card">
            <div class="hero-top">
                <span id="dashboard-title" class="hero-label">DC 연금</span>
                <button onclick="fetchCurrentTabData()" id="refresh-btn" class="refresh-btn">
                    <i id="refresh-icon" class="fa-solid fa-rotate-right" style="font-size:11px;"></i>
                </button>
            </div>
            <p class="hero-eval-label">총 평가금액</p>
            <div id="total-eval" class="hero-amount">₩0</div>
            <div id="diff-inline" class="hero-diff neu">—</div>
        </div>

        <div class="perf-row">
            <div class="perf-card">
                <div class="flex items-center justify-between mb-1">
                    <div class="perf-card-label">오늘 Top 종목</div>
                    <span class="top-badge-today">오늘</span>
                </div>
                <div id="top-day-name" class="top-card-name">—</div>
                <div id="top-day-rate" class="perf-card-rate neu-rate" style="margin-top: 1px;">0.00%</div>
            </div>
            <div class="perf-card">
                <div class="flex items-center justify-between mb-1">
                    <div class="perf-card-label">누적 Top 종목</div>
                    <span class="top-badge-cum">누적</span>
                </div>
                <div id="top-cum-name" class="top-card-name">—</div>
                <div id="top-cum-rate" class="perf-card-rate neu-rate" style="margin-top: 1px;">0.00%</div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-header">
                <span class="chart-title">
                    <i class="fa-solid fa-chart-line" style="color:var(--primary); font-size:10px;"></i>
                    30일 상대수익률
                </span>
                <div id="chart-legend" class="chart-legend-row"></div>
            </div>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <div class="list-wrapper" id="list-wrapper-area">
        <div class="list-header">
            <div>
                <span class="list-title">보유 종목</span>
                <span id="item-count" class="list-count">0</span>
            </div>
            <div class="sort-group">
                <button onclick="changeSort('default')"    id="btn-sort-default"    class="sort-btn active">기본</button>
                <button onclick="changeSort('current')"    id="btn-sort-current"    class="sort-btn">당일</button>
                <button onclick="changeSort('cumulative')" id="btn-sort-cumulative" class="sort-btn">누적</button>
            </div>
        </div>
        <div id="ticker-list" class="ticker-list"></div>
    </div>
</div>

<script>
    const dcGasUrl  = "https://script.google.com/macros/s/AKfycby8XB0dOwk5Tw7yUmQMiv0RfGOeYOjD_1uUcTA-rUYdc4YDoNME46GEK4ZhaxZ0b8hO/exec";
    const isaGasUrl = "https://script.google.com/macros/s/AKfycbxW7zkcTspkQKcUFJrzydqh1gbLaUmQFUraHXeSXke3TC-y4xmjXoZ2F0g8Bq743QTA/exec";
    const targetToken = "p_e2417c74";

    let inputPin = "", allRawData = { dc: null, isa: null };
    let currentTab = 'dc', currentSortType = 'default', isAscending = false;
    let trendChart = null;
    let startX = 0, startY = 0, isPulling = false;
    const ptrThreshold = 80;

    window.onload = () => {
        if (localStorage.getItem('dashboard_auth_token') === targetToken) unlockDashboard();
        initSwipeEvents();
    };

    /* ── PIN ── */
    function simpleHash(str) {
        let h = 1729;
        for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 2654435761);
        return "p_" + (h >>> 0).toString(16);
    }
    function pressKey(n) {
        if (inputPin.length < 6) { inputPin += n; updatePinDots(); if (inputPin.length === 6) setTimeout(verifyPin, 100); }
    }
    function backspacePin() { inputPin = inputPin.slice(0,-1); updatePinDots(); }
    function clearPin()     { inputPin = ""; updatePinDots(); }
    function updatePinDots() {
        for (let i = 0; i < 6; i++) document.getElementById(`dot-${i}`).classList.toggle('active', i < inputPin.length);
    }
    function verifyPin() {
        if (simpleHash(inputPin) === targetToken) {
            if (document.getElementById('keep-login').checked) localStorage.setItem('dashboard_auth_token', targetToken);
            unlockDashboard();
        } else { clearPin(); }
    }
    function unlockDashboard() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'flex';
        fetchCurrentTabData();
    }

    /* ── 탭 전환 ── */
    function switchTab(t) {
        if (currentTab === t) return;
        currentTab = t;
        document.getElementById('tab-dc').classList.toggle('active', t === 'dc');
        document.getElementById('tab-isa').classList.toggle('active', t === 'isa');
        document.getElementById('dashboard-title').innerText = t === 'dc' ? 'DC 연금' : 'ISA 계좌';
        resetSortUI();
        if (allRawData[t]) {
            renderSkeletonUI();
            setTimeout(() => { if (currentTab === t) renderData(allRawData[t]); }, 120);
        } else {
            fetchCurrentTabData();
        }
    }

    /* ── 스켈레톤 ── */
    function renderSkeletonUI() {
        document.getElementById('total-eval').innerHTML = `<span class="skeleton-loading-text sk-hero-amt"></span>`;
        document.getElementById('diff-inline').innerHTML = `<span class="skeleton-loading-text sk-hero-diff"></span>`;
        document.getElementById('diff-inline').className = 'hero-diff neu';
        document.getElementById('top-day-name').innerHTML = `<span class="skeleton-loading-text" style="width:80px; height:14px; display:inline-block;"></span>`;
        document.getElementById('top-day-rate').innerHTML = `<span class="skeleton-loading-text sk-p-rt"></span>`;
        document.getElementById('top-cum-name').innerHTML = `<span class="skeleton-loading-text" style="width:80px; height:14px; display:inline-block;"></span>`;
        document.getElementById('top-cum-rate').innerHTML = `<span class="skeleton-loading-text sk-p-rt"></span>`;
        document.getElementById('item-count').innerText = '-';
        const list = document.getElementById('ticker-list');
        list.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const sk = document.createElement('div');
            sk.className = 'ticker-card';
            sk.innerHTML = `
                <div class="sk-card-left">
                    <div style="display:flex;align-items:center;gap:5px;">
                        <span class="skeleton-loading-text sk-tag"></span>
                        <span class="skeleton-loading-text sk-name"></span>
                    </div>
                    <span class="skeleton-loading-text sk-eval"></span>
                </div>
                <div class="sk-card-right">
                    <div class="skeleton-loading-text sk-cur"></div>
                    <div class="skeleton-loading-text sk-cum"></div>
                </div>`;
            list.appendChild(sk);
        }
    }

    /* ── 페치 ── */
    function fetchCurrentTabData() {
        const icon = document.getElementById('refresh-icon');
        const btn  = document.getElementById('refresh-btn');
        if (icon) icon.classList.add('fa-spin');
        if (btn)  btn.disabled = true;
        renderSkeletonUI();

        const cb = 'cb_' + Date.now();
        window[cb] = (res) => {
            allRawData[currentTab] = res;
            renderData(res);
            const s = document.getElementById('s-script'); if (s) s.remove();
            if (icon) icon.classList.remove('fa-spin');
            if (btn)  btn.disabled = false;
        };
        const s = document.createElement('script');
        s.id = 's-script';
        s.src = (currentTab === 'dc' ? dcGasUrl : isaGasUrl) + "?callback=" + cb;
        s.onerror = () => { if (icon) icon.classList.remove('fa-spin'); if (btn) btn.disabled = false; };
        document.body.appendChild(s);
    }

    /* ── 히어로 오늘수익 인라인 표시 (피드백 반영 문구 변경) ── */
    function renderHeroDiff(amt, rate) {
        const el = document.getElementById('diff-inline');
        if (amt === 0) {
            el.className = 'hero-diff neu';
            el.innerHTML = '<i class="fa-solid fa-minus" style="font-size:10px;"></i> 오늘 수익 변동 없음';
        } else if (amt > 0) {
            el.className = 'hero-diff up';
            el.innerHTML = `<i class="fa-solid fa-arrow-up" style="font-size:10px;"></i> 오늘 수익 +₩${amt.toLocaleString()} (+${rate.toFixed(2)}%)`;
        } else {
            el.className = 'hero-diff down';
            el.innerHTML = `<i class="fa-solid fa-arrow-down" style="font-size:10px;"></i> 오늘 수익 -₩${Math.abs(amt).toLocaleString()} (${rate.toFixed(2)}%)`;
        }
    }

    /* ── 단일화된 빨강/파랑 색상 처리 클래스 반환 (피드백 반영) ── */
    function getRateClass(v) {
        if (v === 0) return 'rate-neu';
        return v > 0 ? 'rate-up' : 'rate-dn';
    }

    /* ── Top 카드 단일 색상 및 텍스트 바인딩 ── */
    function applyTopCardColor(el, val) {
        if (val === 0) {
            el.className = "perf-card-rate neu-rate"; el.innerText = "0.00%";
        } else if (val > 0) {
            el.className = "perf-card-rate up-rate"; el.innerText = "+" + val.toFixed(2) + "%";
        } else {
            el.className = "perf-card-rate dn-rate"; el.innerText = val.toFixed(2) + "%";
        }
    }

    /* ── 데이터 통합 매핑 및 렌더 ── */
    function renderData(data) {
        const s = data.summary;
        document.getElementById('total-eval').innerText = '₩' + Math.round(s.totalEval).toLocaleString();

        const diffAmt  = Math.round(s.diffAmt  || 0);
        const diffRate = parseFloat(s.diffRate  || 0);
        renderHeroDiff(diffAmt, diffRate);

        // 데이터 내부에서 실시간 Top 최고 종목 산출 분기
        if (data.items && data.items.length > 0) {
            let daySorted = [...data.items].sort((a, b) => b.currentRate - a.currentRate);
            let cumSorted = [...data.items].sort((a, b) => b.cumulativeRate - a.cumulativeRate);
            
            document.getElementById('top-day-name').innerText = daySorted[0].name;
            applyTopCardColor(document.getElementById('top-day-rate'), parseFloat(daySorted[0].currentRate || 0));

            document.getElementById('top-cum-name').innerText = cumSorted[0].name;
            applyTopCardColor(document.getElementById('top-cum-rate'), parseFloat(cumSorted[0].cumulativeRate || 0));
        }

        document.getElementById('item-count').innerText = data.items.length;
        renderList(data.items);
        if (data.chart && data.chart.myAsset && data.chart.myAsset.length > 0) renderTrendChart(data.chart);
    }

    /* ── 차트 가독성 최적화 및 상하 자동 스케일링 꽉 채우기 (피드백 반영) ── */
    function renderTrendChart(chartData) {
        const ctx = document.getElementById('trendChart').getContext('2d');

        const allDatesSet = new Set();
        ['dc','isa','sp500','nasdaq','kospi'].forEach(k => {
            if (chartData[k]) chartData[k].forEach(d => allDatesSet.add(d.date));
        });
        const labels = Array.from(allDatesSet).sort();

        function createMap(arr, key) {
            const map = {};
            if (!arr) return map;
            arr.forEach(item => { if (item.date) map[item.date] = parseFloat(item[key] || 0); });
            return map;
        }
        function toRates(map) {
            const vals = Object.values(map).filter(v => v > 0);
            if (!vals.length) return labels.map(() => null);
            const base = map[labels[0]] || vals[0];
            return labels.map(d => {
                const v = map[d];
                return (v && v > 0 && base > 0) ? ((v - base) / base) * 100 : null;
            });
        }
        function toIndexRates(map) {
            const vals = Object.values(map).filter(v => v > 0);
            if (!vals.length) return labels.map(() => null);
            const base = map[labels[0]] || vals[0];
            return labels.map((d, i) => {
                if (i === 0) return 0;
                const v = map[d];
                return (v && v > 0 && base > 0) ? ((v - base) / base) * 100 : null;
            });
        }

        const dcMap     = createMap(chartData.dc,     'total');
        const isaMap    = createMap(chartData.isa,    'total');
        const spMap     = createMap(chartData.sp500,  'value');
        const nasdaqMap = createMap(chartData.nasdaq, 'value');
        const kospiMap  = createMap(chartData.kospi,  'value');

        const COLORS = {
            dc:     '#C62828',
            isa:    '#1565C0',
            sp500:  '#90A4AE',
            nasdaq: '#BCAAA4',
            kospi:  '#F57F17'
        };

        const datasets = [
            chartData.dc  && chartData.dc.length  ? { label:'DC',     data:toRates(dcMap),       borderColor:COLORS.dc,     borderWidth:2.5, fill:false, pointRadius:0, tension:0.2, spanGaps:true } : null,
            chartData.isa && chartData.isa.length  ? { label:'ISA',    data:toRates(isaMap),      borderColor:COLORS.isa,    borderWidth:2.5, fill:false, pointRadius:0, tension:0.2, spanGaps:true } : null,
            chartData.sp500   && chartData.sp500.length   ? { label:'S&P500', data:toIndexRates(spMap),     borderColor:COLORS.sp500,  borderWidth:1.2, borderDash:[4,4], fill:false, pointRadius:0, tension:0.2, spanGaps:true } : null,
            chartData.nasdaq  && chartData.nasdaq.length  ? { label:'NASDAQ', data:toIndexRates(nasdaqMap), borderColor:COLORS.nasdaq, borderWidth:1.2, borderDash:[4,4], fill:false, pointRadius:0, tension:0.2, spanGaps:true } : null,
            chartData.kospi   && chartData.kospi.length   ? { label:'KOSPI',  data:toIndexRates(kospiMap),  borderColor:COLORS.kospi,  borderWidth:1.2, borderDash:[4,4], fill:false, pointRadius:0, tension:0.2, spanGaps:true } : null,
        ].filter(Boolean);

        const legendEl = document.getElementById('chart-legend');
        if (legendEl) {
            legendEl.innerHTML = datasets.map(ds =>
                `<span class="legend-item" style="color:${ds.borderColor}">` +
                `<span class="legend-line" style="background:${ds.borderColor};${ds.borderDash?'background:repeating-linear-gradient(to right,'+ds.borderColor+' 0,'+ds.borderColor+' 4px,transparent 4px,transparent 8px);':''}"></span>` +
                `${ds.label}</span>`
            ).join('');
        }

        if (trendChart) { trendChart.destroy(); trendChart = null; }
        Chart.defaults.font.family = '-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif';

        trendChart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true, maintainAspectRatio: false, events: [],
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { font:{size:9,weight:'600'}, color:'#8FA892', maxTicksLimit:5, maxRotation:0 }
                    },
                    y: {
                        grid: {
                            color: ctx2 => ctx2.tick.value === 0 ? 'rgba(0,0,0,0.2)' : 'rgba(46,125,50,0.04)',
                            lineWidth: ctx2 => ctx2.tick.value === 0 ? 1.5 : 1,
                            drawTicks: false
                        },
                        border: { display: false },
                        ticks: {
                            font:{size:9,weight:'600'}, color:'#8FA892', padding:4,
                            maxTicksLimit: 6,
                            callback: v => (v >= 0 ? '+' : '') + v.toFixed(0) + '%'
                        },
                        // 영역 상하가 꽉 차게 조절되도록 세팅 최적화
                        grace: '5%'
                    }
                }
            }
        });
    }

    /* ── 정렬 ── */
    function resetSortUI() {
        currentSortType = 'default'; isAscending = false;
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-sort-default').classList.add('active');
        document.getElementById('btn-sort-current').innerHTML    = '당일';
        document.getElementById('btn-sort-cumulative').innerHTML = '누적';
    }
    function changeSort(t) {
        if (currentSortType === t) isAscending = !isAscending;
        else { currentSortType = t; isAscending = false; }
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-sort-' + t).classList.add('active');
        const arrow = `<span style="font-size:8px;">${isAscending ? '▲' : '▼'}</span>`;
        document.getElementById('btn-sort-current').innerHTML    = t==='current'    ? `당일 ${arrow}` : '당일';
        document.getElementById('btn-sort-cumulative').innerHTML = t==='cumulative' ? `누적 ${arrow}` : '누적';
        if (allRawData[currentTab]) renderList(allRawData[currentTab].items);
    }

    /* ── 보유 종목 리스트 단일 색상 렌더링 (피드백 반영) ── */
    function renderList(items) {
        const list = document.getElementById('ticker-list');
        list.innerHTML = '';

        let sorted = [...items];
        if (currentSortType === 'default') {
            sorted.sort((a,b) => (a.rebalanceStatus !== '정상' ? 0 : 1) - (b.rebalanceStatus !== '정상' ? 0 : 1));
        } else if (currentSortType === 'current') {
            sorted.sort((a,b) => isAscending ? a.currentRate - b.currentRate : b.currentRate - a.currentRate);
        } else {
            sorted.sort((a,b) => isAscending ? a.cumulativeRate - b.cumulativeRate : b.cumulativeRate - a.cumulativeRate);
        }

        sorted.forEach(item => {
            const isW  = item.rebalanceStatus !== '정상';
            const cur  = parseFloat(item.currentRate    || 0);
            const cum  = parseFloat(item.cumulativeRate || 0);
            
            // 단일화된 깔끔한 컬러 클래스 적용
            const curCls = getRateClass(cur);
            const cumCls = getRateClass(cum);
            
            const curSign = cur >= 0 ? '+' : '';
            const cumSign = cum >= 0 ? '+' : '';

            const card = document.createElement('div');
            card.className = 'ticker-card' + (isW ? ' warn' : '');
            card.innerHTML = `
                <div style="flex:1; min-width:0; padding-right:10px;">
                    <div style="display:flex; align-items:center; gap:5px; margin-bottom:4px; flex-wrap:wrap;">
                        <span style="font-size:9px; font-weight:700; color:var(--primary); background:var(--primary-light); padding:1px 5px; border-radius:3px; flex-shrink:0; letter-spacing:0.03em;">${item.category}</span>
                        <span style="font-size:13px; font-weight:600; color:var(--c-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span style="font-size:12px; color:var(--c-text-secondary); font-weight:500; font-variant-numeric:tabular-nums;">₩${Math.round(item.evalAmt).toLocaleString()}</span>
                        ${isW ? '<span style="font-size:9px; font-weight:700; color:#D97706;"><i class="fa-solid fa-triangle-exclamation" style="font-size:8px; margin-right:2px;"></i>리밸런싱</span>' : ''}
                    </div>
                </div>
                <div style="text-align:right; flex-shrink:0; min-width:60px;">
                    <div style="font-size:14px; font-variant-numeric:tabular-nums;" class="${curCls}">${curSign}${cur.toFixed(2)}%</div>
                    <div style="font-size:11px; font-variant-numeric:tabular-nums; margin-top:2px;" class="${cumCls}">${cumSign}${cum.toFixed(2)}%</div>
                </div>`;
            list.appendChild(card);
        });
    }

    /* ── 스와이프 & PTR ── */
    function initSwipeEvents() {
        const dashboard   = document.getElementById('main-dashboard');
        const listWrapper = document.getElementById('list-wrapper-area');
        const ptrEl       = document.getElementById('ptr-indicator');
        const ptrIcon     = document.getElementById('ptr-icon');
        const ptrText     = document.getElementById('ptr-text');

        window.addEventListener('touchstart', e => {
            if (dashboard.style.display === 'none') return;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY; isPulling = false;
        }, { passive: true });

        window.addEventListener('touchmove', e => {
            if (dashboard.style.display === 'none') return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            if (Math.abs(dx) > 30 && Math.abs(dy) < 50) { if (e.cancelable) e.preventDefault(); return; }
            if (dy > 0 && listWrapper.scrollTop <= 0 && Math.abs(dy) > Math.abs(dx)) {
                isPulling = true;
                const pd = Math.min(dy * 0.4, 110);
                dashboard.style.transform = `translateY(${pd}px)`;
                ptrEl.style.transform     = `translateY(${pd}px)`;
                ptrIcon.style.transform   = pd >= ptrThreshold ? 'rotate(180deg)' : 'rotate(0deg)';
                ptrText.innerText         = pd >= ptrThreshold ? '놓아서 새로고침' : '당겨서 새로고침';
                if (e.cancelable) e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', e => {
            if (dashboard.style.display === 'none') return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (isPulling) {
                isPulling = false;
                dashboard.style.transform = ''; ptrEl.style.transform = ''; ptrIcon.style.transform = '';
                if (Math.min(dy * 0.4, 110) >= ptrThreshold) fetchCurrentTabData();
                return;
            }
            if (Math.abs(dx) > 60 && Math.abs(dy) < 65) {
                if (dx < -60 && currentTab === 'dc') switchTab('isa');
                else if (dx > 60 && currentTab === 'isa') switchTab('dc');
            }
        }, { passive: true });
    }
</script>
