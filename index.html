<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자산 모니터링 시스템</title>
    <link class="apple-touch-icon" href="./icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">   
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-page:          #F0F4F2;
            --bg-card:          #FFFFFF;
            --bg-hero:          linear-gradient(135deg, #1B5E20 0%, #2E7D32 50%, #388E3C 100%);
            --bg-list:          #FFFFFF;

            --c-up:             #D32F2F;
            --c-down:           #1976D2;
            --c-neutral:        #78909C;

            --primary:          #2E7D32;
            --primary-light:    #E8F5E9;
            --primary-dark:     #1B5E20;

            --c-text-primary:   #1A2519;
            --c-text-secondary: #546E57;
            --c-text-label:     #8FA892;
            --c-border:         #DDE8DF;
            --c-divider:         #EBF2EC;

            --skeleton-base:      #E2EDE4;
            --skeleton-highlight: #F0F7F1;

            /* 차트 색상 */
            --c-dc:    #2E7D32;
            --c-isa:   #1565C0;
            --c-sp500: #78909C;
            --c-nas:   #8D6E63;
            --c-kos:   #F57F17;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-page);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: contain;
        }

        #main-dashboard {
            position: fixed; inset: 0;
            max-width: 390px; margin: 0 auto;
            display: flex; flex-direction: column;
            background: var(--bg-page);
            transition: transform 0.2s ease-out;
        }
        .header-fixed { flex-shrink: 0; }

        /* ── PTR ── */
        #ptr-indicator {
            position: absolute; top: -56px; left: 0; right: 0; height: 56px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--primary-light); color: var(--primary);
            font-size: 12px; font-weight: 600;
            border-bottom: 1px solid var(--c-border); z-index: 40;
        }

        /* ── 탭 바 ── */
        .tab-bar {
            padding: 10px 18px 0;
            display: flex; gap: 22px;
            background: var(--bg-page);
            border-bottom: 1px solid var(--c-border);
        }
        .nav-tab {
            font-size: 14px; font-weight: 600;
            color: var(--c-text-label);
            padding-bottom: 8px;
            position: relative; background: none; border: none; cursor: pointer;
            transition: color 0.2s;
        }
        .nav-tab.active { color: var(--primary); font-weight: 700; }
        .nav-tab.active::after {
            content: ""; position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 2.5px; background: var(--primary); border-radius: 2px;
        }

        /* ── 히어로 카드 ── */
        .hero-card {
            margin: 8px 12px 0;
            background: var(--bg-hero);
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 6px 20px rgba(27,94,32,0.15), 0 2px 4px rgba(0,0,0,0.06);
            position: relative;
            overflow: hidden;
        }
        .hero-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .hero-label {
            font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
            color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.15);
            padding: 2px 6px; border-radius: 4px;
        }
        .refresh-btn {
            width: 26px; height: 26px;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.7);
            background: rgba(255,255,255,0.15);
            border: none; cursor: pointer; border-radius: 50%;
            transition: all 0.15s;
        }
        .refresh-btn:active { transform: scale(0.85); background: rgba(255,255,255,0.25); color: #fff; }

        .hero-eval-label { font-size: 11px; color: rgba(255,255,255,0.6); font-weight: 500; margin-bottom: 2px; }
        
        .hero-amount {
            font-size: 34px; font-weight: 850;
            color: #ffffff; letter-spacing: -0.04em;
            font-stretch: 105%;
            line-height: 1.1; font-variant-numeric: tabular-nums;
            margin-bottom: 10px;
        }
        
        .hero-perf-split {
            display: flex;
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 8px;
            margin-top: 4px;
        }
        .hero-perf-item { flex: 1; text-align: center; }
        .hero-perf-item:first-child { border-right: 1px solid rgba(255,255,255,0.15); }
        .hero-perf-label { font-size: 10px; color: rgba(255,255,255,0.6); margin-bottom: 1px; }
        .hero-perf-val { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

        /* ── Top 종목 카드 ── */
        .perf-row {
            display: flex; gap: 8px;
            margin: 8px 12px 0;
        }
        .perf-card {
            flex: 1;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--c-border);
            padding: 10px 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            min-width: 0;
        }
        .perf-card-label {
            font-size: 11px; font-weight: 700;
            color: var(--c-text-secondary);
            letter-spacing: 0.02em; margin-bottom: 4px;
        }
        .perf-card-name {
            font-size: 12px; font-weight: 600; color: var(--c-text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 1px;
        }
        .perf-card-rate {
            font-size: 13px; font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .up-amt, .up-rate { color: var(--c-up); font-weight: 700; }
        .dn-amt, .dn-rate { color: var(--c-down); font-weight: 700; }
        .neu-amt, .neu-rate { color: var(--c-neutral); }

        /* 수익률 굵기(Bold) 제거를 위한 클래스 */
        .rate-up  { color: var(--c-up); font-weight: 500; }
        .rate-dn  { color: var(--c-down); font-weight: 500; }
        .rate-neu { color: var(--c-neutral); font-weight: 500; }

        /* ── 차트 카드 ── */
        .chart-card {
            margin: 8px 12px 0;
            background: #F7FAF8;
            border-radius: 12px;
            border: 1px solid var(--c-border);
            padding: 10px 12px 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .chart-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 6px;
        }
        .chart-title {
            font-size: 11px; font-weight: 700;
            color: var(--c-text-primary);
            white-space: nowrap;
            display: flex; align-items: center; gap: 4px;
        }
        .chart-legend-row {
            display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
        }
        .legend-item {
            display: flex; align-items: center; gap: 2px;
            font-size: 9px; font-weight: 700;
            cursor: pointer;
            padding: 3px 4px; border-radius: 4px;
            transition: opacity 0.15s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .legend-item:active { opacity: 0.6; }
        .legend-item.dimmed { opacity: 0.28; }
        .legend-line {
            width: 10px; height: 2px; border-radius: 1px; flex-shrink: 0;
        }
        .chart-container { position: relative; width: 100%; height: 130px; }

        /* ── 종목 리스트 ── */
        .list-wrapper {
            flex: 1; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--bg-list);
            border-radius: 16px 16px 0 0;
            margin-top: 8px;
            border-top: 1px solid var(--c-border);
        }
        .list-wrapper::-webkit-scrollbar { display: none; }
        .list-wrapper { scrollbar-width: none; }

        .list-header {
            position: sticky; top: 0; z-index: 10;
            background: var(--bg-list);
            padding: 10px 16px 8px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--c-divider);
        }
        .list-title { font-size: 13px; font-weight: 700; color: var(--c-text-primary); }
        .list-count {
            font-size: 11px; font-weight: 700;
            color: var(--primary); background: var(--primary-light);
            padding: 1px 6px; border-radius: 8px; margin-left: 4px;
        }

        .sort-group {
            display: flex; background: var(--bg-page);
            padding: 2px; border-radius: 6px;
            border: 1px solid var(--c-border);
        }
        .sort-btn {
            font-size: 11px; font-weight: 600;
            color: var(--c-text-secondary);
            padding: 2px 8px; border-radius: 4px;
            border: none; background: none; cursor: pointer;
        }
        .sort-btn.active {
            background: var(--primary); color: #fff;
            box-shadow: 0 1px 3px rgba(46,125,50,0.2);
        }

        /* ── 보유 종목 카드 ── */
        .ticker-list { padding: 0 0 24px; }
        .ticker-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 16px;
            border-bottom: 1px solid var(--c-divider);
            background: transparent; position: relative;
            transition: background 0.1s;
        }
        .ticker-card:active { background: var(--bg-page); }
        .ticker-card.warn {
            border-left: 3px solid #F59E0B;
            padding-left: 13px;
            background: rgba(245,158,11,0.02);
        }

        /* ── PIN 화면 ── */
        #auth-screen {
            position: fixed; inset: 0; z-index: 50;
            background: var(--bg-page);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 24px;
        }
        .auth-box {
            background: #fff; padding: 32px 24px;
            border-radius: 24px; border: 1px solid var(--c-border);
            box-shadow: 0 10px 30px rgba(46,125,50,0.07);
            width: 100%; max-width: 300px; text-align: center;
        }
        .pin-dot {
            width: 12px; height: 12px; border-radius: 50%;
            background: #DDE8DF; display: inline-block; transition: all 0.15s;
        }
        .pin-dot.active { background: var(--primary); transform: scale(1.2); }
        .key-btn {
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 600; border-radius: 50%;
            background: var(--bg-page); border: 1px solid var(--c-border);
            color: var(--c-text-primary); cursor: pointer;
        }
        .key-btn:active { background: var(--primary-light); color: var(--primary); transform: scale(0.95); }

        /* ── 스켈레톤 ── */
        @keyframes sk-pulse { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        .skeleton-loading-text {
            background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-highlight) 50%, var(--skeleton-base) 75%);
            background-size: 200% 100%;
            animation: sk-pulse 1.4s infinite ease-in-out;
            border-radius: 4px; color: transparent !important; user-select: none;
        }
        .skeleton-hero {
            background: linear-gradient(90deg, rgba(16, 60, 20, 0.4) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(16, 60, 20, 0.4) 75%);
            background-size: 200% 100%;
            animation: sk-pulse 1.4s infinite ease-in-out;
            border-radius: 6px; color: transparent !important; user-select: none;
        }
        .sk-hero-amt  { width: 160px; height: 32px; display: inline-block; }
        .sk-hero-val  { width: 70px;  height: 14px; display: inline-block; }
        .sk-p-name    { width: 80px;  height: 13px; display: inline-block; margin-top: 2px; }
        .sk-p-rt      { width: 45px;  height: 14px; display: inline-block; margin-top: 2px; }
        .sk-card-left { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .sk-tag  { width: 35px; height: 14px; }
        .sk-name { width: 110px; height: 14px; }
        .sk-eval { width: 65px;  height: 13px; }
        .sk-cur  { width: 90px;  height: 15px; }
    </style>
</head>
<body>

<div id="ptr-indicator">
    <i id="ptr-icon" class="fa-solid fa-arrow-down" style="transition: transform 0.15s;"></i>
    <span id="ptr-text">당겨서 새로고침</span>
</div>

<div id="auth-screen">
    <div class="auth-box">
        <i class="fa-solid fa-shield-halved" style="font-size:28px; color:var(--primary); margin-bottom:16px; display:block;"></i>
        <h2 style="font-size:16px; font-weight:700; color:var(--c-text-primary); margin-bottom:20px;">보안 인증</h2>
        <div style="display:flex; justify-content:center; gap:12px; margin-bottom:26px;">
            <div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div><div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div><div class="pin-dot" id="dot-4"></div><div class="pin-dot" id="dot-5"></div>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px 10px; justify-items:center; max-width:216px; margin:0 auto 20px;">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <button class="key-btn" onclick="clearPin()" style="color:#ef4444; background:#fef2f2;"><i class="fa-solid fa-trash-can"></i></button>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn" onclick="backspacePin()" style="color:#5c7860;"><i class="fa-solid fa-backspace"></i></button>
        </div>
        <label style="font-size:12px; color:var(--c-text-secondary); cursor:pointer; display:inline-flex; align-items:center; gap:4px;">
            <input type="checkbox" id="keep-login" style="accent-color:var(--primary); width:14px; height:14px;"> 자동 로그인 유지
        </label>
    </div>
</div>

<div id="main-dashboard" style="display:none;">
    <div class="header-fixed">
        <div class="tab-bar">
            <button onclick="switchTab('dc')" id="tab-dc" class="nav-tab active">DC 연금</button>
            <button onclick="switchTab('isa')" id="tab-isa" class="nav-tab">ISA 계좌</button>
        </div>

        <div class="hero-card">
            <div class="hero-top">
                <span id="dashboard-title" class="hero-label">DC 연금</span>
                <button onclick="fetchCurrentTabData()" id="refresh-btn" class="refresh-btn">
                    <i id="refresh-icon" class="fa-solid fa-rotate-right" style="font-size:11px;"></i>
                </button>
            </div>
            <p class="hero-eval-label">총 평가금액</p>
            <div id="total-eval" class="hero-amount">₩0</div>
            
            <div class="hero-perf-split">
                <div class="hero-perf-item">
                    <p class="hero-perf-label">오늘 수익</p> <div id="hero-day-perf" class="hero-perf-val text-white">—</div>
                </div>
                <div class="hero-perf-item">
                    <p class="hero-perf-label">누적 수익</p> <div id="hero-cum-perf" class="hero-perf-val text-white">—</div>
                </div>
            </div>
        </div>

        <div class="perf-row">
            <div class="perf-card">
                <div id="label-day" class="perf-card-label">오늘 Top 종목</div> <div id="top-day-name" class="perf-card-name skeleton-loading-text sk-p-name"></div>
                <div id="top-day-rate" class="perf-card-rate skeleton-loading-text sk-p-rt"></div>
            </div>
            <div class="perf-card">
                <div id="label-cum" class="perf-card-label">누적 Top 종목</div> <div id="top-cum-name" class="perf-card-name skeleton-loading-text sk-p-name"></div>
                <div id="top-cum-rate" class="perf-card-rate skeleton-loading-text sk-p-rt"></div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-header">
                <span class="chart-title">
                    <i class="fa-solid fa-chart-line" style="color:var(--primary); font-size:11px;"></i>
                    30일 상대수익률
                </span>
                <div id="chart-legend" class="chart-legend-row"></div>
            </div>
            <div class="chart-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </div>

    <div class="list-wrapper" id="list-wrapper-area">
        <div class="list-header">
            <div>
                <span class="list-title">보유 종목</span>
                <span id="item-count" class="list-count">0</span>
            </div>
            <div class="sort-group">
                <button onclick="changeSort('default')"    id="btn-sort-default"    class="sort-btn active">기본</button>
                <button onclick="changeSort('current')"    id="btn-sort-current"    class="sort-btn">당일</button>
                <button onclick="changeSort('cumulative')" id="btn-sort-cumulative" class="sort-btn">누적</button>
            </div>
        </div>
        <div id="ticker-list" class="ticker-list"></div>
    </div>
</div>

<script>
    const dcGasUrl  = "https://script.google.com/macros/s/AKfycby8XB0dOwk5Tw7yUmQMiv0RfGOeYOjD_1uUcTA-rUYdc4YDoNME46GEK4ZhaxZ0b8hO/exec";
    const isaGasUrl = "https://script.google.com/macros/s/AKfycbxW7zkcTspkQKcUFJrzydqh1gbLaUmQFUraHXeSXke3TC-y4xmjXoZ2F0g8Bq743QTA/exec";
    const targetToken = "p_e2417c74";

    let inputPin = "", allRawData = { dc: null, isa: null };
    let currentTab = 'dc', currentSortType = 'default', isAscending = false;
    let trendChart = null;
    let startX = 0, startY = 0, isPulling = false;
    const ptrThreshold = 80;

    window.onload = () => {
        if (localStorage.getItem('dashboard_auth_token') === targetToken) unlockDashboard();
        initSwipeEvents();
    };

    /* ── PIN ── */
    function simpleHash(str) {
        let h = 1729;
        for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 2654435761);
        return "p_" + (h >>> 0).toString(16);
    }
    function pressKey(n) {
        if (inputPin.length < 6) { inputPin += n; updatePinDots(); if (inputPin.length === 6) setTimeout(verifyPin, 100); }
    }
    function backspacePin() { inputPin = inputPin.slice(0,-1); updatePinDots(); }
    function clearPin()     { inputPin = ""; updatePinDots(); }
    function updatePinDots() {
        for (let i = 0; i < 6; i++) document.getElementById(`dot-${i}`).classList.toggle('active', i < inputPin.length);
    }
    function verifyPin() {
        if (simpleHash(inputPin) === targetToken) {
            if (document.getElementById('keep-login').checked) localStorage.setItem('dashboard_auth_token', targetToken);
            unlockDashboard();
        } else { clearPin(); }
    }
    function unlockDashboard() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'flex';
        fetchCurrentTabData();
    }

    /* ── 탭 전환 ── */
    function switchTab(t) {
        if (currentTab === t) return;
        currentTab = t;
        document.getElementById('tab-dc').classList.toggle('active', t === 'dc');
        document.getElementById('tab-isa').classList.toggle('active', t === 'isa');
        document.getElementById('dashboard-title').innerText = t === 'dc' ? 'DC 연금' : 'ISA 계좌';
        resetSortUI();
        if (allRawData[t]) {
            renderData(allRawData[t]);
        } else {
            fetchCurrentTabData();
        }
    }

    /* ── 스켈레톤 ── */
    function renderSkeletonUI() {
        document.getElementById('total-eval').innerHTML = `<span class="skeleton-hero sk-hero-amt"></span>`;
        document.getElementById('hero-day-perf').innerHTML = `<span class="skeleton-hero sk-hero-val"></span>`;
        document.getElementById('hero-cum-perf').innerHTML = `<span class="skeleton-hero sk-hero-val"></span>`;
        
        document.getElementById('top-day-name').className = 'perf-card-name skeleton-loading-text sk-p-name';
        document.getElementById('top-day-name').innerHTML = '';
        document.getElementById('top-day-rate').className = 'perf-card-rate skeleton-loading-text sk-p-rt';
        document.getElementById('top-day-rate').innerHTML = '';
        
        document.getElementById('top-cum-name').className = 'perf-card-name skeleton-loading-text sk-p-name';
        document.getElementById('top-cum-name').innerHTML = '';
        document.getElementById('top-cum-rate').className = 'perf-card-rate skeleton-loading-text sk-p-rt';
        document.getElementById('top-cum-rate').innerHTML = '';

        document.getElementById('item-count').innerText = '-';
        const list = document.getElementById('ticker-list');
        list.innerHTML = '';
        for (let i = 0; i < 6; i++) {
            const sk = document.createElement('div');
            sk.className = 'ticker-card';
            sk.innerHTML = `
                <div class="sk-card-left">
                    <div style="display:flex;align-items:center;gap:4px;">
                        <span class="skeleton-loading-text sk-tag"></span>
                        <span class="skeleton-loading-text sk-tag"></span>
                        <span class="skeleton-loading-text sk-name"></span>
                    </div>
                    <span class="skeleton-loading-text sk-eval"></span>
                </div>
                <div class="sk-card-right" style="flex-shrink:0;">
                    <div class="skeleton-loading-text sk-cur"></div>
                </div>`;
            list.appendChild(sk);
        }
    }

    /* ── 페치 ── */
    function fetchCurrentTabData() {
        const icon = document.getElementById('refresh-icon');
        const btn  = document.getElementById('refresh-btn');
        if (icon) icon.classList.add('fa-spin');
        if (btn)  btn.disabled = true;
        renderSkeletonUI();

        const cb = 'cb_' + Date.now();
        window[cb] = (res) => {
            allRawData[currentTab] = res;
            renderData(res);
            const s = document.getElementById('s-script'); if (s) s.remove();
            if (icon) icon.classList.remove('fa-spin');
            if (btn)  btn.disabled = false;
        };
        const s = document.createElement('script');
        s.id = 's-script';
        s.src = (currentTab === 'dc' ? dcGasUrl : isaGasUrl) + "?callback=" + cb;
        s.onerror = () => { if (icon) icon.classList.remove('fa-spin'); if (btn) btn.disabled = false; };
        document.body.appendChild(s);
    }

    /* ── 수익률 텍스트 포맷 헬퍼 ── */
    function getPerfText(amt, rate, isHero = false) {
        const sign = amt > 0 ? '+' : '';
        const pctSign = rate > 0 ? '+' : '';
        if (isHero) {
            return `${pctSign}${rate.toFixed(2)}% (${sign}${Math.round(amt).toLocaleString()})`;
        }
        return `${sign}₩${Math.round(amt).toLocaleString()} (${pctSign}${rate.toFixed(2)}%)`;
    }

    /* ── 색상 분기 로직 ── */
    function getRateClass(v) {
        if (v === 0) return 'rate-neu';
        return v > 0 ? 'rate-up' : 'rate-dn';
    }

    /* ── 메인 데이터 렌더링 ── */
    function renderData(data) {
        const s = data.summary;
        document.getElementById('total-eval').innerText = '₩' + Math.round(s.totalEval).toLocaleString();

        const diffAmt  = Math.round(s.diffAmt  || 0);
        const diffRate = parseFloat(s.diffRate  || 0);
        const profAmt  = Math.round(s.totalProfitAmt  || 0);
        const profRate = parseFloat(s.totalProfitRate || 0);

        document.getElementById('hero-day-perf').innerText = getPerfText(diffAmt, diffRate, true);
        document.getElementById('hero-cum-perf').innerText = getPerfText(profAmt, profRate, true);
        
        if (data.items && data.items.length > 0) {
            const itemsCopy = [...data.items];
            
            itemsCopy.sort((a,b) => b.currentRate - a.currentRate);
            const topDay = itemsCopy[0];
            const tdElName = document.getElementById('top-day-name');
            const tdElRate = document.getElementById('top-day-rate');
            tdElName.className = 'perf-card-name';
            tdElName.innerText = topDay.name;
            tdElRate.className = 'perf-card-rate ' + (topDay.currentRate > 0 ? 'up-rate' : topDay.currentRate < 0 ? 'dn-rate' : 'neu-rate');
            tdElRate.innerText = (topDay.currentRate >= 0 ? '+' : '') + topDay.currentRate.toFixed(2) + '%';

            itemsCopy.sort((a,b) => b.cumulativeRate - a.cumulativeRate);
            const topCum = itemsCopy[0];
            const tcElName = document.getElementById('top-cum-name');
            const tcElRate = document.getElementById('top-cum-rate');
            tcElName.className = 'perf-card-name';
            tcElName.innerText = topCum.name;
            tcElRate.className = 'perf-card-rate ' + (topCum.cumulativeRate > 0 ? 'up-rate' : topCum.cumulativeRate < 0 ? 'dn-rate' : 'neu-rate');
            tcElRate.innerText = (topCum.cumulativeRate >= 0 ? '+' : '') + topCum.cumulativeRate.toFixed(2) + '%';
        }

        document.getElementById('item-count').innerText = data.items.length;
        renderList(data.items);
        if (data.chart && data.chart.myAsset && data.chart.myAsset.length > 0) renderTrendChart(data.chart);
    }

    /* ── 차트 구성 ── */
    const CHART_KEYS   = ['DC','ISA','S&P500','NASDAQ','KOSPI'];
    const hiddenKeysByTab = {
        dc:  new Set(['ISA','S&P500','NASDAQ','KOSPI']),
        isa: new Set(['DC', 'S&P500','NASDAQ','KOSPI'])
    };
    function getHiddenKeys() { return hiddenKeysByTab[currentTab]; }

    function renderTrendChart(chartData) {
        const ctx = document.getElementById('trendChart').getContext('2d');

        const allDatesSet = new Set();
        ['dc','isa','sp500','nasdaq','kospi'].forEach(k => {
            if (chartData[k]) chartData[k].forEach(d => allDatesSet.add(d.date));
        });
        const labels = Array.from(allDatesSet).sort();

        function createMap(arr, key) {
            const map = {};
            if (!arr) return map;
            arr.forEach(item => { if (item.date) map[item.date] = parseFloat(item[key] || 0); });
            return map;
        }
        function toRates(map) {
            const vals = Object.values(map).filter(v => v > 0);
            if (!vals.length) return labels.map(() => null);
            const base = map[labels[0]] || vals[0];
            return labels.map(d => {
                const v = map[d];
                return (v && v > 0 && base > 0) ? ((v - base) / base) * 100 : null;
            });
        }
        function toIndexRates(map) {
            const vals = Object.values(map).filter(v => v > 0);
            if (!vals.length) return labels.map(() => null);
            const base = map[labels[0]] || vals[0];
            return labels.map((d, i) => {
                if (i === 0) return 0;
                const v = map[d];
                return (v && v > 0 && base > 0) ? ((v - base) / base) * 100 : null;
            });
        }

        const dcMap     = createMap(chartData.dc,    'total');
        const isaMap    = createMap(chartData.isa,   'total');
        const spMap     = createMap(chartData.sp500, 'value');
        const nasdaqMap = createMap(chartData.nasdaq,'value');
        const kospiMap  = createMap(chartData.kospi, 'value');

        const COLORS = {
            'DC':     '#1565C0',
            'ISA':    '#C62828',
            'S&P500': '#546E57',
            'NASDAQ': '#78909C',
            'KOSPI':  '#8D6E63'
        };

        const dataMap = {
            'DC':     toRates(dcMap),
            'ISA':    toRates(isaMap),
            'S&P500': toIndexRates(spMap),
            'NASDAQ': toIndexRates(nasdaqMap),
            'KOSPI':  toIndexRates(kospiMap),
        };
        const isDash = { 'DC': false, 'ISA': false, 'S&P500': true, 'NASDAQ': true, 'KOSPI': true };
        const lineW  = { 'DC': 2.2,   'ISA': 2.2,   'S&P500': 1.1,  'NASDAQ': 1.1,  'KOSPI': 1.1 };

        const datasets = CHART_KEYS
            .filter(k => dataMap[k] && dataMap[k].some(v => v !== null))
            .map(k => ({
                label:              k,
                data:               dataMap[k],
                borderColor:        COLORS[k],
                borderWidth:        lineW[k],
                borderDash:         isDash[k] ? [3, 3] : undefined,
                fill:               false,
                pointRadius:        0,
                pointHoverRadius:   0,
                pointHitRadius:     0,
                pointStyle:         false,
                tension:            0.2,
                spanGaps:           true,
                hidden:             getHiddenKeys().has(k)
            }));

        function calcYRange() {
            let allVals = [];
            datasets.forEach(ds => {
                if (!ds.hidden && !getHiddenKeys().has(ds.label)) {
                    ds.data.forEach(v => { if (v !== null) allVals.push(v); });
                }
            });
            if (!allVals.length) return { min: -5, max: 5 };
            const mn = Math.min(...allVals);
            const mx = Math.max(...allVals);
            const pad = Math.max((mx - mn) * 0.12, 2);
            return {
                min: Math.floor((mn - pad) / 5) * 5,
                max: Math.ceil((mx  + pad) / 5) * 5
            };
        }

        const legendEl = document.getElementById('chart-legend');
        if (legendEl) {
            legendEl.innerHTML = CHART_KEYS.map(k => {
                const color = COLORS[k];
                const dash  = isDash[k];
                const dimmed = getHiddenKeys().has(k) ? ' dimmed' : '';
                const lineStyle = dash
                    ? `background:repeating-linear-gradient(to right,${color} 0,${color} 3px,transparent 3px,transparent 6px);`
                    : `background:${color};`;
                return `<span class="legend-item${dimmed}" data-key="${k}" style="color:${color}">` +
                       `<span class="legend-line" style="${lineStyle}"></span>${k}</span>`;
            }).join('');

            legendEl.querySelectorAll('.legend-item').forEach(el => {
                el.addEventListener('click', () => {
                    const key = el.getAttribute('data-key');
                    const hk = getHiddenKeys();
                    if (hk.has(key)) hk.delete(key);
                    else hk.add(key);

                    const ds = trendChart.data.datasets.find(d => d.label === key);
                    if (ds) {
                        ds.hidden = getHiddenKeys().has(key);
                        el.classList.toggle('dimmed', getHiddenKeys().has(key));
                    }

                    const range = calcYRange();
                    trendChart.options.scales.y.min = range.min;
                    trendChart.options.scales.y.max = range.max;
                    trendChart.update('active');
                });
            });
        }

        if (trendChart) { trendChart.destroy(); trendChart = null; }
        Chart.defaults.font.family = '-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif';
        Chart.defaults.elements.point.radius      = 0;
        Chart.defaults.elements.point.hoverRadius = 0;
        Chart.defaults.elements.point.hitRadius   = 0;

        const initRange = calcYRange();

        trendChart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: null },
                plugins: {
                    legend:  { display: false },
                    tooltip: { enabled: false }
                },
                layout: { padding: { top: 2, bottom: 0, left: 0, right: 0 } },
                scales: {
                    x: {
                        grid:  { display: false },
                        border:{ display: false },
                        ticks: {
                            font: { size: 9, weight: '600' },
                            color: '#8FA892',
                            maxTicksLimit: 5,
                            maxRotation: 0,
                            padding: 2
                        }
                    },
                    y: {
                        min:  initRange.min,
                        max:  initRange.max,
                        grid: {
                            color:     ctx2 => ctx2.tick.value === 0 ? 'rgba(0,0,0,0.12)' : 'rgba(46,125,50,0.04)',
                            lineWidth: ctx2 => ctx2.tick.value === 0 ? 1.2 : 1,
                            drawTicks: false
                        },
                        border: { display: false },
                        ticks: {
                            font:         { size: 9, weight: '600' },
                            color:        '#8FA892',
                            padding:      2,
                            maxTicksLimit: 5,
                            callback: v => (v >= 0 ? '+' : '') + v.toFixed(0) + '%'
                        }
                    }
                }
            }
        });
    }

    /* ── 정렬 ── */
    function resetSortUI() {
        currentSortType = 'default'; isAscending = false;
        document.querySelectorAll('.sort-group .sort-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-sort-default').classList.add('active');
        document.getElementById('btn-sort-current').innerHTML    = '당일';
        document.getElementById('btn-sort-cumulative').innerHTML = '누적';
    }
    function changeSort(t) {
        if (currentSortType === t) isAscending = !isAscending;
        else { currentSortType = t; isAscending = false; }
        document.querySelectorAll('.sort-group .sort-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-sort-' + t).classList.add('active');
        const arrow = `<span style="font-size:8px;">${isAscending ? '▲' : '▼'}</span>`;
        document.getElementById('btn-sort-current').innerHTML    = t==='current'    ? `당일 ${arrow}` : '당일';
        document.getElementById('btn-sort-cumulative').innerHTML = t==='cumulative' ? `누적 ${arrow}` : '누적';
        if (allRawData[currentTab]) renderList(allRawData[currentTab].items);
    }

    /* ── 보유 종목 카드 렌더링 ── */
    function renderList(items) {
        const list = document.getElementById('ticker-list');
        list.innerHTML = '';

        let sorted = [...items];
        if (currentSortType === 'default') {
            sorted.sort((a,b) => (a.rebalanceStatus !== '정상' ? 0 : 1) - (b.rebalanceStatus !== '정상' ? 0 : 1));
        } else if (currentSortType === 'current') {
            sorted.sort((a,b) => isAscending ? a.currentRate - b.currentRate : b.currentRate - a.currentRate);
        } else {
            sorted.sort((a,b) => isAscending ? a.cumulativeRate - b.cumulativeRate : b.cumulativeRate - a.cumulativeRate);
        }

        sorted.forEach(item => {
            const isW  = item.rebalanceStatus !== '정상';
            const cur  = parseFloat(item.currentRate    || 0);
            const cum  = parseFloat(item.cumulativeRate || 0);
            
            const curCls = getRateClass(cur);
            const cumCls = getRateClass(cum);
            const curSign = cur >= 0 ? '+' : '';
            const cumSign = cum >= 0 ? '+' : '';

            const targetVal  = parseFloat(item.targetWeight || 0).toFixed(1);
            const currentVal = parseFloat(item.currentWeight || 0).toFixed(1);

            const card = document.createElement('div');
            card.className = 'ticker-card' + (isW ? ' warn' : '');
            card.innerHTML = `
                <div style="flex:1; min-width:0; padding-right:8px;">
                    <div style="display:flex; align-items:center; gap:4px; margin-bottom:2px; flex-wrap:nowrap;">
                        <span style="font-size:9px; font-weight:700; color:var(--primary); background:var(--primary-light); padding:0.5px 4px; border-radius:3px; flex-shrink:0;">${item.category}</span>
                        <span style="font-size:9px; font-weight:600; color:#6B7280; background:#E5E7EB; padding:0.5px 4px; border-radius:3px; flex-shrink:0; font-family:monospace;">${item.ticker || '—'}</span>
                        <span style="font-size:12.5px; font-weight:600; color:var(--c-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:5px;">
                        <span style="font-size:11px; color:var(--c-text-secondary); font-weight:500; font-variant-numeric:tabular-nums;">₩${Math.round(item.evalAmt).toLocaleString()}</span>
                        ${isW ? `<span style="font-size:9px; font-weight:700; color:#D97706;"><i class="fa-solid fa-triangle-exclamation" style="font-size:8px; margin-right:1px;"></i>리밸런싱 [목표 ${targetVal}% / 현재 ${currentVal}%]</span>` : ''}
                    </div>
                </div>
                <div style="text-align:right; flex-shrink:0; white-space:nowrap; font-size:12.5px; font-variant-numeric:tabular-nums;">
                    <span class="${curCls}">${curSign}${cur.toFixed(2)}%</span>
                    <span class="${cumCls}" style="font-size:10.5px; margin-left:3px; opacity:0.85;">(${cumSign}${cum.toFixed(2)}%)</span>
                </div>`;
            list.appendChild(card);
        });
    }

    /* ── 스와이프 & PTR ── */
    function initSwipeEvents() {
        const dashboard   = document.getElementById('main-dashboard');
        const listWrapper = document.getElementById('list-wrapper-area');
        const ptrEl       = document.getElementById('ptr-indicator');
        const ptrIcon     = document.getElementById('ptr-icon');
        const ptrText     = document.getElementById('ptr-text');

        window.addEventListener('touchstart', e => {
            if (dashboard.style.display === 'none') return;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY; isPulling = false;
        }, { passive: true });

        window.addEventListener('touchmove', e => {
            if (dashboard.style.display === 'none') return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;
            if (Math.abs(dx) > 30 && Math.abs(dy) < 50) { if (e.cancelable) e.preventDefault(); return; }
            if (dy > 0 && listWrapper.scrollTop <= 0 && Math.abs(dy) > Math.abs(dx)) {
                isPulling = true;
                const pd = Math.min(dy * 0.4, 110);
                dashboard.style.transform = `translateY(${pd}px)`;
                ptrEl.style.transform     = `translateY(${pd}px)`;
                ptrIcon.style.transform   = pd >= ptrThreshold ? 'rotate(180deg)' : 'rotate(0deg)';
                ptrText.innerText         = pd >= ptrThreshold ? '놓아서 새로고침' : '당겨서 새로고침';
                if (e.cancelable) e.preventDefault();
            }
        }, { passive: false });

        window.addEventListener('touchend', e => {
            if (dashboard.style.display === 'none') return;
            const dx = e.changedTouches[0].clientX - startX;
            const dy = e.changedTouches[0].clientY - startY;
            if (isPulling) {
                isPulling = false;
                dashboard.style.transform = ''; ptrEl.style.transform = ''; ptrIcon.style.transform = '';
                if (Math.min(dy * 0.4, 110) >= ptrThreshold) fetchCurrentTabData();
                return;
            }
            if (Math.abs(dx) > 60 && Math.abs(dy) < 65) {
                if (dx < -60 && currentTab === 'dc') switchTab('isa');
                else if (dx > 60 && currentTab === 'isa') switchTab('dc');
            }
        }, { passive: true });
    }
</script>
