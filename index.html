<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>자산 모니터링 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-page:    #080f1e;   /* 페이지 배경 — 가장 어둡게 */
            --bg-card:    #162035;   /* 서머리 카드 — 확실히 떠보이게 */
            --bg-list:    #0d1729;   /* 종목 영역 배경 */
            --bg-ticker:  #111e33;   /* 종목 카드 */
            --bg-ticker-warn: #1a2030; /* 리밸런싱 종목 */

            --c-up:       #ff5c5c;   /* 양수 빨강 */
            --c-up-sub:   #ff9090;
            --c-down:     #4db8ff;   /* 음수 파랑 — 밝게 */
            --c-down-sub: #88ccff;
            --c-neutral:  #4a5c78;

            --c-text-primary:   #e8edf5;
            --c-text-secondary: #4a607d;
            --c-text-label:     #364d6a;
            --c-border:         rgba(255,255,255,0.05);
            --c-divider:        rgba(255,255,255,0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-page);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ── 전체 레이아웃 ── */
        #main-dashboard {
            position: fixed;
            inset: 0;
            max-width: 390px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--bg-page);
        }

        .header-fixed { flex-shrink: 0; }

        /* ── 탭 바 ── */
        .tab-bar {
            padding: 16px 18px 0;
            display: flex;
            gap: 24px;
            background: var(--bg-page);
            border-bottom: 1px solid var(--c-divider);
        }
        .nav-tab {
            color: var(--c-text-label);
            font-size: 14px;
            font-weight: 600;
            padding-bottom: 10px;
            position: relative;
            background: none; border: none;
            cursor: pointer;
            transition: color 0.2s;
            letter-spacing: 0.01em;
        }
        .nav-tab.active { color: var(--c-text-primary); }
        .nav-tab.active::after {
            content: "";
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 2px;
            background: var(--c-text-primary);
            border-radius: 2px;
        }

        /* ── 서머리 카드 ── */
        .summary-card {
            margin: 10px 12px 0;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.07);
            /* 카드가 배경에서 확실히 뜨도록 그림자 강화 */
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03),
                0 8px 32px rgba(0,0,0,0.5),
                0 1px 0 rgba(255,255,255,0.06) inset;
            padding: 14px 16px 14px;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .card-title {
            font-size: 10px;
            font-weight: 700;
            color: var(--c-text-label);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .refresh-btn {
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            color: var(--c-text-label);
            background: none; border: none; cursor: pointer;
            border-radius: 50%;
            transition: color 0.15s, transform 0.1s;
        }
        .refresh-btn:active { transform: scale(0.85); color: var(--c-text-primary); }

        /* 총 평가금액 — 위계의 정점 */
        .eval-label {
            font-size: 10px;
            color: var(--c-text-label);
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 3px;
        }
        .eval-number {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: #ffffff;          /* 순백 — 카드 내 유일한 흰색 */
            font-variant-numeric: tabular-nums;
            line-height: 1.05;
            margin-bottom: 12px;
        }

        /* 구분선 */
        .divider-h {
            height: 1px;
            background: var(--c-divider);
            margin-bottom: 11px;
        }
        .divider-v {
            width: 1px;
            align-self: stretch;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.08), transparent);
            flex-shrink: 0;
        }

        /* 당일/누적 */
        .perf-row { display: flex; align-items: stretch; }
        .perf-block { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .perf-block:first-child { padding-right: 14px; }
        .perf-block:last-child  { padding-left: 14px; }
        .perf-label  { font-size: 10px; font-weight: 600; color: var(--c-text-label); letter-spacing: 0.06em; margin-bottom: 1px; }
        .perf-amount { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
        .perf-rate   { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; opacity: 0.9; }

        /* 다크 카드 위 색상 */
        .up-amt  { color: var(--c-up); }
        .up-rate { color: var(--c-up-sub); }
        .dn-amt  { color: var(--c-down); }
        .dn-rate { color: var(--c-down-sub); }
        .neu-amt, .neu-rate { color: var(--c-neutral); }

        /* ── 종목 스크롤 영역 ── */
        .list-wrapper {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--bg-list);
            border-radius: 14px 14px 0 0;
            margin-top: 10px;
        }
        .list-wrapper::-webkit-scrollbar { display: none; }
        .list-wrapper { scrollbar-width: none; }

        /* 리스트 헤더 — sticky */
        .list-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg-list);
            padding: 11px 14px 9px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--c-divider);
        }
        .list-title { font-size: 12px; font-weight: 700; color: var(--c-text-secondary); }
        .list-count { font-size: 12px; font-weight: 400; color: var(--c-text-label); margin-left: 4px; }

        /* 정렬 버튼 */
        .sort-group {
            display: flex;
            background: rgba(0,0,0,0.3);
            padding: 2px;
            border-radius: 7px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .sort-btn {
            font-size: 11px; font-weight: 600;
            color: var(--c-text-label);
            padding: 3px 10px;
            border-radius: 5px;
            border: none; background: none;
            cursor: pointer;
            transition: all 0.15s;
        }
        .sort-btn.active {
            background: #1e3050;
            color: var(--c-text-primary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }

        /* ── 종목 카드 (구분선 방식) ── */
        .ticker-list { padding: 0 0 32px; }

        .ticker-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            border-bottom: 1px solid var(--c-divider);
            background: transparent;
            transition: background 0.1s;
            position: relative;
        }
        .ticker-card:active { background: rgba(255,255,255,0.02); }

        /* 리밸런싱 — 왼쪽 보더 라인 */
        .ticker-card.warn {
            border-left: 2.5px solid #f59e0b;
            padding-left: 11.5px;
            background: rgba(245,158,11,0.04);
        }

        /* 카드 위 색상 (동일 규칙) */
        .card-up   { color: var(--c-up); }
        .card-down { color: var(--c-down); }
        .card-neu  { color: var(--c-neutral); }

        /* ── PIN 화면 ── */
        #auth-screen {
            position: fixed; inset: 0; z-index: 50;
            background: #080f1e;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 24px;
        }
        .auth-box {
            background: #162035;
            padding: 32px 28px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.07);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            width: 100%; max-width: 300px;
            text-align: center;
        }
        .pin-dot {
            width: 11px; height: 11px; border-radius: 50%;
            background: #1e3050; display: inline-block;
            transition: all 0.15s;
        }
        .pin-dot.active { background: var(--c-text-primary); transform: scale(1.15); }
        .key-btn {
            width: 62px; height: 62px;
            display: flex; align-items: center; justify-content: center;
            font-size: 19px; font-weight: 600;
            border-radius: 50%;
            background: #1a2d48;
            border: 1px solid rgba(255,255,255,0.06);
            color: var(--c-text-primary);
            cursor: pointer;
            transition: background 0.1s;
        }
        .key-btn:active { background: #243d5e; }
    </style>
</head>
<body>

<!-- ── PIN 인증 ── -->
<div id="auth-screen">
    <div class="auth-box">
        <i class="fa-solid fa-shield-halved" style="font-size:26px; color:#2a4060; margin-bottom:18px; display:block;"></i>
        <h2 style="font-size:15px; font-weight:700; color:var(--c-text-primary); margin-bottom:22px; letter-spacing:0.02em;">보안 인증</h2>
        <div style="display:flex; justify-content:center; gap:11px; margin-bottom:26px;">
            <div class="pin-dot" id="dot-0"></div><div class="pin-dot" id="dot-1"></div><div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div><div class="pin-dot" id="dot-4"></div><div class="pin-dot" id="dot-5"></div>
        </div>
        <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px 8px; justify-items:center; max-width:216px; margin:0 auto 18px;">
            <button class="key-btn" onclick="pressKey('1')">1</button>
            <button class="key-btn" onclick="pressKey('2')">2</button>
            <button class="key-btn" onclick="pressKey('3')">3</button>
            <button class="key-btn" onclick="pressKey('4')">4</button>
            <button class="key-btn" onclick="pressKey('5')">5</button>
            <button class="key-btn" onclick="pressKey('6')">6</button>
            <button class="key-btn" onclick="pressKey('7')">7</button>
            <button class="key-btn" onclick="pressKey('8')">8</button>
            <button class="key-btn" onclick="pressKey('9')">9</button>
            <button class="key-btn" onclick="clearPin()" style="color:#f87171;"><i class="fa-solid fa-trash-can" style="font-size:14px;"></i></button>
            <button class="key-btn" onclick="pressKey('0')">0</button>
            <button class="key-btn" onclick="backspacePin()" style="color:#4a607d;"><i class="fa-solid fa-backspace" style="font-size:14px;"></i></button>
        </div>
        <label style="font-size:11px; color:var(--c-text-label); cursor:pointer;">
            <input type="checkbox" id="keep-login" style="margin-right:4px; accent-color:#4a80b0;"> 자동 로그인 유지
        </label>
    </div>
</div>

<!-- ── 메인 대시보드 ── -->
<div id="main-dashboard" style="display:none;">

    <div class="header-fixed">
        <!-- 탭 -->
        <div class="tab-bar">
            <button onclick="switchTab('dc')" id="tab-dc" class="nav-tab active">DC 연금</button>
            <button onclick="switchTab('isa')" id="tab-isa" class="nav-tab">ISA 계좌</button>
        </div>

        <!-- 서머리 카드 -->
        <div class="summary-card">
            <div class="card-title-row">
                <span id="dashboard-title" class="card-title">DC 연금</span>
                <button onclick="fetchCurrentTabData()" id="refresh-btn" class="refresh-btn">
                    <i id="refresh-icon" class="fa-solid fa-rotate-right" style="font-size:11px;"></i>
                </button>
            </div>
            <p class="eval-label">총 평가금액</p>
            <div id="total-eval" class="eval-number">₩0</div>
            <div class="divider-h"></div>
            <div class="perf-row">
                <div class="perf-block">
                    <span class="perf-label">당일 수익</span>
                    <span id="diff-amt"  class="perf-amount neu-amt">₩0</span>
                    <span id="diff-rate" class="perf-rate  neu-rate">0.00%</span>
                </div>
                <div class="divider-v"></div>
                <div class="perf-block">
                    <span class="perf-label">누적 수익</span>
                    <span id="total-profit-amt"  class="perf-amount neu-amt">₩0</span>
                    <span id="total-profit-rate" class="perf-rate  neu-rate">0.00%</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 종목 스크롤 -->
    <div class="list-wrapper">
        <div class="list-header">
            <div>
                <span class="list-title">보유 종목</span>
                <span id="item-count" class="list-count">0</span>
            </div>
            <div class="sort-group">
                <button onclick="changeSort('default')"    id="btn-sort-default"    class="sort-btn active">기본</button>
                <button onclick="changeSort('current')"    id="btn-sort-current"    class="sort-btn">당일</button>
                <button onclick="changeSort('cumulative')" id="btn-sort-cumulative" class="sort-btn">누적</button>
            </div>
        </div>
        <div id="ticker-list" class="ticker-list"></div>
    </div>

</div>

<script>
    const dcGasUrl  = "https://script.google.com/macros/s/AKfycby8XB0dOwk5Tw7yUmQMiv0RfGOeYOjD_1uUcTA-rUYdc4YDoNME46GEK4ZhaxZ0b8hO/exec";
    const isaGasUrl = "https://script.google.com/macros/s/AKfycbxW7zkcTspkQKcUFJrzydqh1gbLaUmQFUraHXeSXke3TC-y4xmjXoZ2F0g8Bq743QTA/exec";
    const targetToken = "p_e2417c74";

    let inputPin = "", allRawData = { dc: null, isa: null };
    let currentTab = 'dc', currentSortType = 'default', isAscending = false;

    window.onload = () => {
        if (localStorage.getItem('dashboard_auth_token') === targetToken) unlockDashboard();
    };

    /* ── PIN ── */
    function simpleHash(str) {
        let h = 1729;
        for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 2654435761);
        return "p_" + (h >>> 0).toString(16);
    }
    function pressKey(n) {
        if (inputPin.length < 6) {
            inputPin += n; updatePinDots();
            if (inputPin.length === 6) setTimeout(verifyPin, 100);
        }
    }
    function backspacePin() { inputPin = inputPin.slice(0,-1); updatePinDots(); }
    function clearPin()     { inputPin = ""; updatePinDots(); }
    function updatePinDots() {
        for (let i = 0; i < 6; i++)
            document.getElementById(`dot-${i}`).classList.toggle('active', i < inputPin.length);
    }
    function verifyPin() {
        if (simpleHash(inputPin) === targetToken) {
            if (document.getElementById('keep-login').checked)
                localStorage.setItem('dashboard_auth_token', targetToken);
            unlockDashboard();
        } else { clearPin(); }
    }
    function unlockDashboard() {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'flex';
        fetchCurrentTabData();
    }

    /* ── 탭 ── */
    function switchTab(t) {
        currentTab = t;
        document.getElementById('tab-dc').classList.toggle('active', t === 'dc');
        document.getElementById('tab-isa').classList.toggle('active', t === 'isa');
        document.getElementById('dashboard-title').innerText = t === 'dc' ? 'DC 연금' : 'ISA 계좌';
        resetSortUI();
        if (allRawData[t]) renderData(allRawData[t]);
        else fetchCurrentTabData();
    }

    /* ── 페치 ── */
    function fetchCurrentTabData() {
        const icon = document.getElementById('refresh-icon');
        const btn  = document.getElementById('refresh-btn');
        if (icon) icon.classList.add('fa-spin');
        if (btn)  btn.disabled = true;

        const cb = 'cb_' + Date.now();
        window[cb] = (res) => {
            allRawData[currentTab] = res;
            renderData(res);
            const s = document.getElementById('s-script');
            if (s) s.remove();
            if (icon) icon.classList.remove('fa-spin');
            if (btn)  btn.disabled = false;
        };
        const s = document.createElement('script');
        s.id  = 's-script';
        s.src = (currentTab === 'dc' ? dcGasUrl : isaGasUrl) + "?callback=" + cb;
        s.onerror = () => {
            if (icon) icon.classList.remove('fa-spin');
            if (btn)  btn.disabled = false;
        };
        document.body.appendChild(s);
    }

    /* ── 색상 헬퍼 ── */
    function applyPerfColor(amtEl, rateEl, amt, rate) {
        if (amt === 0) {
            amtEl.className = 'perf-amount neu-amt';  amtEl.innerText = '₩0';
            rateEl.className = 'perf-rate neu-rate';  rateEl.innerText = '0.00%';
        } else if (amt > 0) {
            amtEl.className = 'perf-amount up-amt';   amtEl.innerText = '+₩' + amt.toLocaleString();
            rateEl.className = 'perf-rate up-rate';   rateEl.innerText = '+' + rate.toFixed(2) + '%';
        } else {
            amtEl.className = 'perf-amount dn-amt';   amtEl.innerText = '-₩' + Math.abs(amt).toLocaleString();
            rateEl.className = 'perf-rate dn-rate';   rateEl.innerText = rate.toFixed(2) + '%';
        }
    }

    /* ── 렌더 ── */
    function renderData(data) {
        const s = data.summary;
        document.getElementById('total-eval').innerText = '₩' + Math.round(s.totalEval).toLocaleString();
        applyPerfColor(
            document.getElementById('diff-amt'),
            document.getElementById('diff-rate'),
            Math.round(s.diffAmt || 0), parseFloat(s.diffRate || 0)
        );
        applyPerfColor(
            document.getElementById('total-profit-amt'),
            document.getElementById('total-profit-rate'),
            Math.round(s.totalProfitAmt || 0), parseFloat(s.totalProfitRate || 0)
        );
        document.getElementById('item-count').innerText = data.items.length;
        renderList(data.items);
    }

    /* ── 정렬 ── */
    function resetSortUI() {
        currentSortType = 'default'; isAscending = false;
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-sort-default').classList.add('active');
        document.getElementById('btn-sort-current').innerHTML    = '당일';
        document.getElementById('btn-sort-cumulative').innerHTML = '누적';
    }
    function changeSort(t) {
        if (currentSortType === t) isAscending = !isAscending;
        else { currentSortType = t; isAscending = false; }
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-sort-' + t).classList.add('active');
        const arrow = `<span style="font-size:8px;">${isAscending ? '▲' : '▼'}</span>`;
        document.getElementById('btn-sort-current').innerHTML    = t === 'current'    ? `당일 ${arrow}` : '당일';
        document.getElementById('btn-sort-cumulative').innerHTML = t === 'cumulative' ? `누적 ${arrow}` : '누적';
        if (allRawData[currentTab]) renderList(allRawData[currentTab].items);
    }

    /* ── 종목 카드 ── */
    function renderList(items) {
        const list = document.getElementById('ticker-list');
        list.innerHTML = '';

        let sorted = [...items];
        if (currentSortType === 'default') {
            sorted.sort((a,b) => (a.rebalanceStatus !== '정상' ? 0 : 1) - (b.rebalanceStatus !== '정상' ? 0 : 1));
        } else if (currentSortType === 'current') {
            sorted.sort((a,b) => isAscending ? a.currentRate - b.currentRate : b.currentRate - a.currentRate);
        } else {
            sorted.sort((a,b) => isAscending ? a.cumulativeRate - b.cumulativeRate : b.cumulativeRate - a.cumulativeRate);
        }

        sorted.forEach(item => {
            const isW    = item.rebalanceStatus !== '정상';
            const cur    = parseFloat(item.currentRate    || 0);
            const cum    = parseFloat(item.cumulativeRate || 0);
            const curCls = cur > 0 ? 'card-up' : cur < 0 ? 'card-down' : 'card-neu';
            const cumCls = cum > 0 ? 'card-up' : cum < 0 ? 'card-down' : 'card-neu';
            const curSign = cur >= 0 ? '+' : '';
            const cumSign = cum >= 0 ? '+' : '';

            const card = document.createElement('div');
            card.className = 'ticker-card' + (isW ? ' warn' : '');
            card.innerHTML = `
                <div style="flex:1; min-width:0; padding-right:10px;">
                    <div style="display:flex; align-items:center; gap:5px; margin-bottom:3px; flex-wrap:wrap;">
                        <span style="font-size:9px; font-weight:700; color:#2e4a6a; background:rgba(255,255,255,0.05); padding:1px 5px; border-radius:3px; letter-spacing:0.04em; flex-shrink:0;">${item.category}</span>
                        <span style="font-size:13px; font-weight:600; color:var(--c-text-primary); letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.name}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span style="font-size:11px; color:#2e4a6a; font-weight:500; font-variant-numeric:tabular-nums;">₩${Math.round(item.evalAmt).toLocaleString()}</span>
                        ${isW ? '<span style="font-size:9px; font-weight:700; color:#d97706; letter-spacing:0.03em;">● 리밸런싱</span>' : ''}
                    </div>
                </div>
                <div style="text-align:right; flex-shrink:0;">
                    <div style="font-size:14px; font-weight:800; font-variant-numeric:tabular-nums;" class="${curCls}">${curSign}${cur.toFixed(2)}%</div>
                    <div style="font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px;" class="${cumCls}">${cumSign}${cum.toFixed(2)}%</div>
                </div>`;
            list.appendChild(card);
        });
    }
</script>
</body>
</html>
